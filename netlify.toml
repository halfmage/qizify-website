# Headers only. Build settings stay in the Netlify UI, which is where they are today.

# The US demo is embedded on /us only. Block framing by other sites.
[[headers]]
  for = "/us-demo*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"

# Same for the apprenticeship demo embedded on the homepage.
[[headers]]
  for = "/demo-ausbildung*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
