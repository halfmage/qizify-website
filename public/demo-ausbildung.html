<!doctype html>
<!-- Apprenticeship demo (Fachinformatiker/-in AE). Language: ?lang=de (default) or ?lang=en. Personalize with ?academy=Name&color=1D4ED8&letter=N -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LearnSlice Tutor-Demo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: app shell, fixed sidebar (workspace, courses, roles) + scrolling work area; collapses to a drawer on phones. Follows the LearnSlice product design (violet accent, quiet greys, dark tutor stage). */
:root{
  --bg:#FFFFFF; --panel:#FAF9FD; --surface:#FFFFFF; --sunken:#F4F3F8;
  --line:#E8E6EF; --line-strong:#D7D4E1;
  --fg:#16141D; --muted:#676478; --faint:#9895A7;
  --accent-default:#6D28D9; --accent:var(--accent-default); --on-accent:#FFFFFF;
  --good:#15803D; --good-soft:#E7F5EC; --warn:#B45309; --warn-soft:#FCF1E1; --bad:#B42318; --bad-soft:#FDECEA;
  --xp:#F59E0B; --stage:#17151F; --stage-2:#221F2E; --stage-fg:#F4F2FA; --stage-muted:#A9A5BA;
  --shadow:0 1px 2px rgba(22,18,40,.05),0 6px 20px rgba(22,18,40,.06);
  --f-ui:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-serif:"Newsreader",Georgia,"Times New Roman",serif;
  --r:12px; --r-lg:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111016; --panel:#15141B; --surface:#1B1A22; --sunken:#201F28;
  --line:#2A2833; --line-strong:#3A3846;
  --fg:#EEEBF5; --muted:#A7A3B6; --faint:#78758A;
  --accent-default:#8B5CF6;
  --good:#4ADE80; --good-soft:#15291C; --warn:#FBBF24; --warn-soft:#2C2313; --bad:#F87171; --bad-soft:#2E1717;
  --stage:#0C0B11; --stage-2:#17151F; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111016; --panel:#15141B; --surface:#1B1A22; --sunken:#201F28;
  --line:#2A2833; --line-strong:#3A3846;
  --fg:#EEEBF5; --muted:#A7A3B6; --faint:#78758A;
  --accent-default:#8B5CF6;
  --good:#4ADE80; --good-soft:#15291C; --warn:#FBBF24; --warn-soft:#2C2313; --bad:#F87171; --bad-soft:#2E1717;
  --stage:#0C0B11; --stage-2:#17151F; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}
:root{--accent-soft:color-mix(in srgb,var(--accent) 11%,var(--surface));--accent-line:color-mix(in srgb,var(--accent) 30%,var(--line));--accent-ink:color-mix(in srgb,var(--accent) 82%,var(--fg))}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14.5px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.015em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:268px minmax(0,1fr);height:100%}
/* Sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.ws{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.ws b{display:block;font-size:14.5px;line-height:1.2}
.ws small{color:var(--muted);font-size:12px}
.xp{padding:4px 16px 14px}
.xp-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.xp-row span:last-child{color:var(--muted);font-weight:500}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--xp);border-radius:9px}
.nav{display:flex;flex-direction:column;gap:2px;padding:4px 10px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:8px 10px;border-radius:9px;text-align:left;font-weight:500;color:var(--fg)}
.nav button:hover{background:var(--sunken)}
.nav button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.pill.soon{background:none;border:1px dashed var(--line-strong);color:var(--muted)}
.nav .new.soon{background:none;border:1px dashed var(--line-strong);color:var(--muted);font-weight:600}
.up{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 6px 4px 12px;background:var(--surface)}
.up .sw{width:36px;height:20px}
.up .sw::after{width:14px;height:14px}
.up .sw.on::after{transform:translateX(16px)}
.soon-bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 16px;background:var(--sunken);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.nav .new{margin-left:auto;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink);padding:1px 7px;border-radius:99px}
.side-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:18px 20px 6px}
.courses{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.courses button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:9px;text-align:left;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.courses button:hover{background:var(--sunken)}
.courses button.on{color:var(--accent-ink)}
.courses .cnt{margin-left:auto;font-weight:600;color:var(--faint)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;background:var(--sunken);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.who b{display:block;font-size:13.5px;line-height:1.2}
.who small{color:var(--muted);font-size:12px}
.powered{font-size:11.5px;color:var(--faint)}
.powered b{color:var(--muted)}

/* Main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 24px;border-bottom:1px solid var(--line);min-height:56px;flex-wrap:wrap}
.crumb{font-weight:600;display:flex;gap:8px;align-items:center;min-width:0}
.crumb span{color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg-label{font-size:12px;color:var(--faint);font-weight:600}
.demo-pill{font-size:12px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:99px;padding:3px 10px}
.scroll{flex:1;overflow-y:auto;min-height:0}
.foot-note{border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center;padding:10px 16px}
.page{padding-block:32px 48px;padding-inline:24px;max-width:1120px;margin:0 auto}
.narrow{max-width:720px}

/* Generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:9px 18px;font-weight:600;font-size:14px;color:var(--fg);transition:background .15s,border-color .15s}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.sm{padding:6px 13px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.pill.mute{background:var(--sunken);color:var(--muted)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.h1{font-size:30px;font-weight:800;line-height:1.15}
.h2{font-size:22px;font-weight:800}
.h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600}
.input,.select,.textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
.textarea{min-height:96px;resize:vertical;line-height:1.5}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:6px}
.srcbtn{font-weight:600;background:var(--accent-soft);color:var(--accent-ink);padding:1px 8px;border-radius:99px;border:0;font-size:12px;cursor:pointer}
.srcbtn:hover{background:color-mix(in srgb,var(--accent) 20%,var(--surface))}
.passage{border-left:3px solid var(--accent);background:var(--sunken);padding:12px 14px;border-radius:0 10px 10px 0;line-height:1.6}
.src b{font-weight:600;background:var(--accent-soft);color:var(--accent-ink);padding:1px 8px;border-radius:99px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Home */
.home{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.spark{width:60px;height:60px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.spark svg{width:26px;height:26px}
.continue{width:100%;background:var(--accent);color:var(--on-accent);border:0;border-radius:99px;padding:14px 22px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px;text-align:left}
.continue span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.continue:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.sugg{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left}
.sugg button{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;width:100%}
.sugg button:hover{border-color:var(--accent-line)}
.sugg .ic{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.sugg .tx{flex:1;min-width:0}
.sugg .tx small{display:flex;gap:8px;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sugg .arrow{color:var(--faint)}

/* Tutor */
.tutor-wrap{display:flex;flex-direction:column;height:100%;min-height:0}
.tutor-scroll{flex:1;overflow-y:auto;min-height:0}
.tutor-inner{max-width:760px;margin:0 auto;padding:20px 24px 12px;display:flex;flex-direction:column;gap:18px}
.stage{position:relative;background:var(--stage);color:var(--stage-fg);border-radius:18px;overflow:hidden;height:250px;display:grid;place-items:center;flex:none}
.stage .tl,.stage .tr,.stage .bl,.stage .br{position:absolute;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.stage .tl{top:14px;left:14px}.stage .tr{top:14px;right:14px}.stage .bl{bottom:14px;left:16px;flex-direction:column;align-items:flex-start;gap:0}.stage .br{bottom:14px;right:14px}
.chip-dark{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);padding:3px 10px;border-radius:99px;color:var(--stage-fg)}
.live-dot{width:7px;height:7px;border-radius:50%;background:#4ADE80;display:inline-block}
.stage .bl b{font-size:15px}.stage .bl small{color:var(--stage-muted);font-size:12px}
.orb{width:128px;height:128px;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--accent) 35%,#fff),var(--accent) 55%,color-mix(in srgb,var(--accent) 60%,#000));box-shadow:0 0 60px color-mix(in srgb,var(--accent) 55%,transparent);transition:transform .3s}
.orb::before,.orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);opacity:.0}
.speaking .orb{animation:pulse 1.1s ease-in-out infinite}
.speaking .orb::before{animation:ring 1.6s ease-out infinite}
.speaking .orb::after{animation:ring 1.6s .8s ease-out infinite}
.listening .orb{transform:scale(.9)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes ring{0%{opacity:.7;transform:scale(.95)}100%{opacity:0;transform:scale(1.35)}}
.wave{display:flex;gap:4px;align-items:center;height:28px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity .2s}
.listening .wave{opacity:1}
.wave i{width:4px;border-radius:4px;background:var(--stage-muted);height:6px}
.listening .wave i{animation:wv .9s ease-in-out infinite;background:#fff}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes wv{0%,100%{height:6px}50%{height:24px}}
.illu svg{width:150px;height:150px}
.speaking .illu .mouth{animation:mouth .35s ease-in-out infinite}
@keyframes mouth{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.illu .mouth{transform-origin:75px 84px;transform-box:view-box}
.silhouette{width:170px;height:190px;border-radius:14px;background:linear-gradient(180deg,var(--stage-2),var(--stage));display:grid;place-items:end center;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.silhouette svg{width:150px;height:170px}
.thread{display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg.user{justify-content:flex-end}
.bubble{max-width:min(560px,100%);padding:11px 15px;border-radius:16px;line-height:1.55;min-width:0;overflow-wrap:anywhere}
.msg.user .bubble{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px}
.msg.ai .bubble{background:var(--sunken);border-bottom-left-radius:6px}
.msg .av{width:28px;height:28px;background:var(--fg);color:var(--bg);border:0;font-size:12px}
.msg.ai .stack{min-width:0}
.nomatch{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--warn);margin-top:6px;font-weight:600}
.cq{display:flex;flex-direction:column;gap:14px}
.cq .q{font-weight:600}
.cq .opts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.opt{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:left;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent-line)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:500}
.chips button:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.composer-wrap{border-top:1px solid var(--line);padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px))}
.composer{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:99px;padding:6px 6px 6px 18px;background:var(--surface)}
.composer input{flex:1;border:0;background:none;outline:none;min-width:0;padding:6px 0}
.mic{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.mic.on{animation:pulse 1s infinite}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn.on{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.meter{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:12.5px;color:var(--muted)}
.meter .bar{width:44px;margin:0;height:4px}
.meter .bar>i{background:var(--accent)}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

/* Plan */
.plan-list{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.mod{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);flex-wrap:wrap}
.mod .n{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--sunken);color:var(--muted);flex:none}
.mod.done .n{background:var(--good-soft);color:var(--good)}
.mod.active .n{background:var(--accent-soft);color:var(--accent-ink)}
.mod .tx{flex:1;min-width:180px}
.mod .tx b{display:block}
.mod .tx small{color:var(--muted)}
.mod.open .tx b{color:var(--muted)}
.plan-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.plan-head .pct{color:var(--accent-ink);font-weight:800}
.bar.acc>i{background:var(--accent)}

/* Practice */
.qcard{padding:24px;display:flex;flex-direction:column;gap:14px;margin-top:20px}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qtext{font-size:18px;font-weight:700;line-height:1.4}
.fb{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.fb.good{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb.part{background:var(--warn-soft)}
.fb b{font-weight:700}
.rub{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.rub div{display:flex;gap:8px;align-items:flex-start}
.rub .ok{color:var(--good)}.rub .no{color:var(--bad)}
.score-big{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}
.steps{display:flex;gap:4px}
.steps i{height:4px;flex:1;border-radius:4px;background:var(--line)}
.steps i.done{background:var(--accent)}

/* Instructor */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.kpi{padding:16px}
.kpi small{color:var(--muted);font-size:12.5px;font-weight:600}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.kpi span{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-top:16px}
.panel{padding:20px;min-width:0}

.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
tr.click{cursor:pointer}

.qlist{display:flex;flex-direction:column}
.qlist div{display:flex;gap:12px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}

.callout{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--warn-soft);margin-top:16px}

.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(18px)}
.sw:disabled{opacity:.85;cursor:not-allowed}

.set-head{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start;margin-top:20px}

.fields2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pres{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:10px}

.swatch.on{box-shadow:0 0 0 2px var(--fg)}
input[type=color]{width:40px;height:36px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);padding:2px}
.brand-prev{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}

.sign{border-top:1px solid var(--line-strong);padding-top:8px;min-width:220px}
.sign b{display:block}
.sign small,.cert-foot>small{color:var(--muted);font-size:12.5px}

.rec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}
.rec .card{padding:14px 16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:10px}
.acard{padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.acard .meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.acard p{font-size:13px;color:var(--muted)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:24px;flex-wrap:wrap}
.page-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}

.log .card{padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.log ul{margin:0;padding-left:18px}
.log li{margin:3px 0}
.missed{display:flex;flex-direction:column;gap:12px}
.missed>div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
@media (max-width:1000px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.rec{grid-template-columns:minmax(0,1fr)}}

    norm:{k:['normalisier','normalform','1nf','2nf','3nf','redundanz','anomalie','transitiv','atomar'],q:'Wie normalisiere ich eine Tabelle bis zur 3. Normalform?',
     a:'Normalisierung entfernt Redundanzen, damit beim Ändern keine Widersprüche (Anomalien) entstehen. 1. Normalform: Jedes Feld enthält nur einen atomaren Wert, keine Listen. 2. Normalform: Die Tabelle ist in der 1NF, und jedes Nichtschlüsselattribut hängt vom gesamten Primärschlüssel ab, nicht nur von einem Teil davon. Das betrifft nur zusammengesetzte Schlüssel. 3. Normalform: Die Tabelle ist in der 2NF, und kein Nichtschlüsselattribut hängt transitiv, also über ein anderes Nichtschlüsselattribut, vom Schlüssel ab. Die Lösung ist jedes Mal dieselbe: die betroffenen Spalten in eine eigene Tabelle auslagern und per Fremdschlüssel verknüpfen.',
     simple:'Jede Information steht genau an einer Stelle. 1NF: ein Wert pro Feld. 2NF: alles hängt am ganzen Schlüssel. 3NF: nichts hängt über Umwege am Schlüssel.',
     ex:'Die Tabelle Bestellung(BestellNr, ArtikelNr, Menge, Artikelname, KundenNr, Kundenort) hat den Schlüssel BestellNr + ArtikelNr. Artikelname hängt nur von der ArtikelNr ab: Verstoß gegen die 2NF, also kommt er in eine Tabelle Artikel. KundenNr und Kundenort hängen nur von der BestellNr ab, also wandern sie in eine Tabelle Bestellkopf. Dort hängt Kundenort über die KundenNr vom Schlüssel ab: Verstoß gegen die 3NF, also eine eigene Tabelle Kunde.',
     src:'Modul 3 · Normalisierung · S. 12',t:'Normalisierung bis zur 3NF',
     pass:'Eine Relation befindet sich in der ersten Normalform, wenn alle Attribute nur atomare Werte enthalten. Sie ist in der zweiten Normalform, wenn sie in der ersten Normalform ist und jedes Nichtschlüsselattribut voll funktional vom gesamten Primärschlüssel abhängt. Sie ist in der dritten Normalform, wenn sie in der zweiten Normalform ist und kein Nichtschlüsselattribut transitiv vom Primärschlüssel abhängt.'},
    join:{k:['join','inner','left','outer','verknüpf','zwei tabellen','right join'],q:'Was ist der Unterschied zwischen INNER JOIN und LEFT JOIN?',
     a:'Ein INNER JOIN liefert nur die Zeilen, für die es in beiden Tabellen einen passenden Partner gibt. Ein LEFT JOIN liefert alle Zeilen der linken Tabelle, auch ohne Partner. Fehlt der Partner, stehen in den Spalten der rechten Tabelle NULL-Werte. Ein RIGHT JOIN macht dasselbe von der anderen Seite. Faustregel: Wenn du auch Datensätze ohne Gegenstück sehen willst, zum Beispiel Kunden ohne Bestellung, brauchst du einen LEFT JOIN.',
     simple:'INNER JOIN: nur Paare. LEFT JOIN: alle von links, und rechts wird ergänzt, was es gibt.',
     ex:'SELECT k.Name, b.BestellNr FROM Kunde k LEFT JOIN Bestellung b ON b.KundenNr = k.KundenNr; zeigt alle Kunden. Wer noch nie bestellt hat, erscheint mit NULL bei BestellNr. Mit INNER JOIN würden genau diese Kunden fehlen. Hängst du WHERE b.BestellNr IS NULL an, bekommst du nur die Kunden ohne Bestellung.',
     src:'Modul 3 · SQL-Abfragen · S. 27',t:'INNER JOIN und LEFT JOIN',
     pass:'Ein INNER JOIN gibt nur Datensätze zurück, bei denen die Verknüpfungsbedingung in beiden Tabellen erfüllt ist. Ein LEFT (OUTER) JOIN gibt zusätzlich alle Datensätze der linken Tabelle zurück, für die es keinen passenden Datensatz in der rechten Tabelle gibt. Die Spalten der rechten Tabelle werden dann mit NULL gefüllt.'},
    oop:{k:['objektorient','oop','prozedural','klasse','objekt','vererbung','kapselung','polymorph'],q:'Was unterscheidet objektorientierte von prozeduraler Programmierung?',
     a:'Prozedurale Programmierung teilt ein Programm in Funktionen (Prozeduren), die nacheinander Daten verarbeiten. Daten und Funktionen sind getrennt. Objektorientierte Programmierung bündelt Daten (Attribute) und Verhalten (Methoden) in Klassen, aus denen du Objekte erzeugst. Wichtige Prinzipien sind Kapselung (Daten nur über Methoden ändern), Vererbung (eine Klasse übernimmt Eigenschaften einer anderen) und Polymorphie (dieselbe Methode verhält sich je nach Objekt unterschiedlich). C ist eine typisch prozedurale Sprache, Java und C# sind objektorientiert.',
     simple:'Prozedural: ein Rezept mit Arbeitsschritten. Objektorientiert: Dinge, die ihre eigenen Daten kennen und selbst wissen, was sie können.',
     ex:'Im Lager-Tool gibt es eine Klasse Artikel mit den Attributen nummer und bestand und der Methode entnehmen(menge). Die Methode prüft, ob genug Bestand da ist, bevor sie ihn verringert. Weil bestand privat ist, kann kein anderer Programmteil den Bestand aus Versehen negativ setzen. Das ist Kapselung.',
     src:'Modul 2 · Programmierparadigmen · S. 8',t:'Prozedural und objektorientiert',
     pass:'Bei der prozeduralen Programmierung wird ein Problem in Prozeduren zerlegt, die auf getrennt gehaltene Daten zugreifen. Die objektorientierte Programmierung fasst Daten und die darauf arbeitenden Methoden in Klassen zusammen. Zentrale Konzepte sind Kapselung, Vererbung und Polymorphie.'},
    unit:{k:['modultest','unit test','unittest','unit-test','junit','testfall','assert','testen','test'],q:'Was ist ein Modultest und wie schreibe ich einen?',
     a:'Ein Modultest (Unit Test) prüft die kleinste testbare Einheit, meist eine Methode oder Klasse, isoliert vom Rest des Systems. Ein guter Test folgt dem Muster Arrange, Act, Assert: Testdaten vorbereiten, die Methode aufrufen, das Ergebnis mit dem erwarteten Wert vergleichen. Teste nicht nur den Normalfall, sondern auch Grenzwerte und ungültige Eingaben. Weil Modultests automatisch laufen, merkst du sofort, wenn eine Änderung etwas kaputt macht. Typische Werkzeuge sind JUnit für Java oder pytest für Python.',
     simple:'Ein Modultest ist eine kleine Prüfung für ein einzelnes Bauteil deines Programms: gleiche Eingabe, erwartetes Ergebnis, automatisch geprüft.',
     ex:'Für eine Methode rabatt(betrag), die ab 100 Euro 5 Prozent Rabatt gibt, schreibst du mindestens drei Tests: 99,99 Euro ergibt 0 Euro Rabatt, 100 Euro ergibt 5 Euro, und ein negativer Betrag löst einen Fehler aus. Der Test genau an der Grenze von 100 Euro findet die meisten Fehler, zum Beispiel ein > statt >=.',
     src:'Modul 6 · Modultests · S. 15',t:'Modultests schreiben',
     pass:'Modultests prüfen einzelne Komponenten isoliert und automatisiert. Ein Testfall besteht aus Vorbedingungen, Eingabewerten und dem erwarteten Ergebnis. Neben Normalfällen sind insbesondere Grenzwerte und ungültige Eingaben zu testen (Grenzwertanalyse, Äquivalenzklassen).'},
    git:{k:['git','branch','merge','versionsverwaltung','commit','pull request','konflikt','rebase'],q:'Wie arbeite ich mit Branches in Git?',
     a:'Ein Branch ist ein eigener Entwicklungszweig. Der Hauptzweig (oft main) enthält den stabilen Stand. Für jede Änderung legst du einen neuen Branch an, zum Beispiel feature/csv-export, und machst dort deine Commits. Ist die Änderung fertig und getestet, wird sie per Merge in main übernommen, meist über einen Pull Request mit Code-Review. Haben zwei Branches dieselbe Stelle verändert, entsteht ein Merge-Konflikt, den du von Hand auflöst. So bleibt main jederzeit lauffähig, und jede Änderung ist nachvollziehbar.',
     simple:'Ein Branch ist eine Kopie zum Ausprobieren. Wenn alles passt, wird sie zurück in den Hauptstand gemischt.',
     ex:'git switch -c feature/csv-export legt deinen Branch an. Nach deinen Commits pushst du ihn und öffnest einen Pull Request. Deine Ausbilderin prüft den Code, die Modultests laufen automatisch, dann wird gemergt. Geht in main gleichzeitig ein Bugfix live, ist er von deiner Arbeit nicht betroffen.',
     src:'Modul 6 · Versionsverwaltung · S. 22',t:'Branches in Git',
     pass:'Mit Branches lassen sich Änderungen parallel und isoliert entwickeln. Der Hauptzweig enthält den freigegebenen Stand. Änderungen werden nach Review und erfolgreichen Tests per Merge zusammengeführt. Konkurrierende Änderungen an derselben Stelle führen zu Merge-Konflikten, die manuell aufgelöst werden.'},
    subnet:{k:['subnet','subnetz','netzmaske','cidr','/24','/25','/26','/27','hosts','ipv4','broadcast'],q:'Wie teile ich ein IPv4-Netz in Subnetze auf?',
     a:'Eine IPv4-Adresse hat 32 Bit. Die Präfixlänge, zum Beispiel /24, sagt, wie viele Bit zum Netzanteil gehören. Der Rest ist der Hostanteil. Für Subnetze leihst du dir Bits aus dem Hostanteil: Jedes geliehene Bit verdoppelt die Zahl der Subnetze. Nutzbare Hosts pro Subnetz sind 2 hoch Hostbits minus 2, weil die erste Adresse das Netz und die letzte den Broadcast bezeichnet. Aus 192.168.10.0/24 werden mit 2 geliehenen Bits vier /26-Netze mit je 62 nutzbaren Adressen.',
     simple:'Du schneidest einen großen Adressblock in gleich große Stücke. Pro Stück gehen zwei Adressen weg: eine für das Netz, eine für den Broadcast.',
     ex:'192.168.10.0/26 hat die Maske 255.255.255.192. Die vier Subnetze beginnen bei .0, .64, .128 und .192. Im ersten Netz ist .0 die Netzadresse, .1 bis .62 sind Hosts und .63 ist der Broadcast. Braucht die Entwicklung 50 Rechner, reicht ein /26-Netz. Für 70 Rechner brauchst du ein /25.',
     src:'Modul 5 · IPv4 und Subnetting · S. 19',t:'IPv4-Subnetting',
     pass:'Die Anzahl der Hostadressen eines Subnetzes ergibt sich aus 2 hoch n minus 2, wobei n die Anzahl der Hostbits ist. Die erste Adresse eines Subnetzes ist die Netzadresse, die letzte die Broadcastadresse. Beide können keinem Host zugewiesen werden.'},
    crypto:{k:['symmetrisch','asymmetrisch','verschlüssel','schlüssel','aes','rsa','public key','privat','hybrid','tls'],q:'Was ist der Unterschied zwischen symmetrischer und asymmetrischer Verschlüsselung?',
     a:'Bei symmetrischer Verschlüsselung nutzen Sender und Empfänger denselben geheimen Schlüssel zum Ver- und Entschlüsseln. Das ist schnell, zum Beispiel AES, aber der Schlüssel muss sicher übertragen werden. Bei asymmetrischer Verschlüsselung hat jede Seite ein Schlüsselpaar: Was mit dem öffentlichen Schlüssel verschlüsselt wird, kann nur der passende private Schlüssel entschlüsseln. Das löst das Problem des Schlüsselaustauschs, ist aber deutlich langsamer, zum Beispiel RSA. In der Praxis kombiniert man beides als hybride Verschlüsselung, so wie bei TLS: Asymmetrisch wird ein Sitzungsschlüssel vereinbart, danach läuft die Verbindung symmetrisch.',
     simple:'Symmetrisch: ein Schlüssel für auf und zu, beide brauchen eine Kopie. Asymmetrisch: ein Briefkasten. Jeder kann etwas einwerfen, nur der Besitzer kann ihn öffnen.',
     ex:'Wenn du im Browser das Kundenportal deines Betriebs öffnest, handeln Browser und Server mit einem asymmetrischen Verfahren einen gemeinsamen Schlüssel aus. Alles danach, also Seiten und Formulare, wird mit diesem symmetrischen Schlüssel verschlüsselt, weil das viel schneller ist.',
     src:'Modul 4 · Verschlüsselung · S. 14',t:'Symmetrisch und asymmetrisch',
     pass:'Symmetrische Verfahren (z. B. AES) verwenden einen gemeinsamen geheimen Schlüssel und eignen sich für große Datenmengen. Asymmetrische Verfahren (z. B. RSA) verwenden ein Schlüsselpaar aus öffentlichem und privatem Schlüssel. Hybride Verfahren nutzen asymmetrische Kryptografie für den Schlüsselaustausch und symmetrische für die eigentliche Datenübertragung.'},
    netz:{k:['netzplan','kritischer pfad','kritischen pfad','puffer','projektmanagement','vorgang','faz','fez','saz','sez'],q:'Wie finde ich im Netzplan den kritischen Pfad?',
     a:'Der Netzplan zeigt die Vorgänge eines Projekts mit Dauer und Abhängigkeiten. In der Vorwärtsrechnung bestimmst du für jeden Vorgang den frühesten Anfang (FAZ) und das früheste Ende (FEZ). Bei mehreren Vorgängern zählt der größte FEZ. In der Rückwärtsrechnung bestimmst du vom Projektende aus das späteste Ende (SEZ) und den spätesten Anfang (SAZ). Bei mehreren Nachfolgern zählt der kleinste SAZ. Der Gesamtpuffer ist SAZ minus FAZ. Alle Vorgänge mit Gesamtpuffer 0 bilden den kritischen Pfad: Verzögert sich einer davon, verschiebt sich das ganze Projekt.',
     simple:'Der kritische Pfad ist die längste Kette von Arbeitsschritten ohne Luft. Jede Verspätung darauf verspätet das ganze Projekt.',
     ex:'Projekt Lager-App: A Anforderungen (2 Tage), danach parallel B Datenbank (4 Tage) und C Oberfläche (3 Tage), dann D Test (2 Tage), der B und C braucht. B endet an Tag 6, C an Tag 5. D beginnt also nach Tag 6 und endet an Tag 8. C hat 1 Tag Puffer, der kritische Pfad ist A, B, D.',
     src:'Modul 1 · Netzplantechnik · S. 31',t:'Netzplan und kritischer Pfad',
     pass:'Der Gesamtpuffer eines Vorgangs ergibt sich aus SAZ minus FAZ bzw. SEZ minus FEZ. Vorgänge mit einem Gesamtpuffer von null liegen auf dem kritischen Pfad. Eine Verzögerung dieser Vorgänge verzögert den Endtermin des Projekts.'}

    msg:`Hallo Lena,

   qa:{
    nutz:{k:['nutzwert','angebot','vergleich','gewicht','kriterien','entscheid'],q:'Wie rechne ich eine Nutzwertanalyse?',
     a:'Mit einer Nutzwertanalyse vergleichst du Angebote anhand mehrerer Kriterien, nicht nur nach dem Preis. 1. Kriterien festlegen, zum Beispiel Preis, Leistung, Garantie und Energieverbrauch. 2. Jedes Kriterium gewichten, zusammen ergeben die Gewichte 100 Prozent. 3. Jedes Angebot pro Kriterium bewerten, etwa mit 1 bis 10 Punkten. 4. Punkte mal Gewicht rechnen und pro Angebot aufsummieren. Das Angebot mit dem höchsten Nutzwert gewinnt. Begründe die Gewichtung immer kurz.',
     simple:'Du gibst jedem Kriterium ein Gewicht, bewertest jedes Angebot und rechnest Punkte mal Gewicht. Die höchste Summe gewinnt.',
     ex:'Zwei Laptops: Preis zählt 40 Prozent, Leistung 35, Garantie 25. Laptop A bekommt 8, 6 und 5 Punkte: 3,2 + 2,1 + 1,25 = 6,55. Laptop B bekommt 6, 8 und 8 Punkte: 2,4 + 2,8 + 2,0 = 7,2. B ist teurer, hat aber den höheren Nutzwert.',
     src:'Modul 1 · Angebotsvergleich · S. 9',t:'Nutzwertanalyse',
     pass:'Die Nutzwertanalyse bewertet Alternativen anhand gewichteter Kriterien. Die Summe der Gewichtungen beträgt 100 Prozent. Der Teilnutzen ergibt sich aus Erfüllungsgrad mal Gewichtung, der Gesamtnutzwert aus der Summe der Teilnutzen.'},
    raid:{k:['raid','festplatte','spiegel','parität','ausfallsicher','striping','speicher'],q:'Welches RAID-Level passt wofür?',
     a:'RAID verbindet mehrere Festplatten zu einem Verbund. RAID 0 (Striping) verteilt die Daten auf mindestens zwei Platten: schnell, aber ohne Ausfallsicherheit. Fällt eine Platte aus, sind alle Daten weg. RAID 1 (Mirroring) spiegelt die Daten auf eine zweite Platte: Eine Platte darf ausfallen, nutzbar ist aber nur die Hälfte der Kapazität. RAID 5 braucht mindestens drei Platten und verteilt Daten und Paritätsinformationen: Eine Platte darf ausfallen, verloren geht nur die Kapazität einer Platte. Wichtig: RAID ersetzt keine Datensicherung. Gelöschte oder verschlüsselte Dateien sind auf allen Platten gleichzeitig weg.',
     simple:'RAID 0 ist schnell, aber riskant. RAID 1 ist eine Kopie in Echtzeit. RAID 5 ist ein guter Mittelweg ab drei Platten. Ein Backup ersetzt keins davon.',
     ex:'Ein Server mit vier 4-TB-Platten in RAID 5 hat 12 TB nutzbaren Speicher und übersteht den Ausfall einer Platte. Dieselben Platten als zwei RAID-1-Paare ergeben nur 8 TB. Für den PC in der Buchhaltung reicht meist eine SSD, wenn die Daten auf dem Server liegen und dort gesichert werden.',
     src:'Modul 2 · Speicherlösungen · S. 17',t:'RAID-Level',
     pass:'RAID 0 verteilt Daten ohne Redundanz auf mehrere Datenträger. RAID 1 spiegelt Daten auf zwei Datenträger. RAID 5 verteilt Daten und Paritätsinformationen auf mindestens drei Datenträger und toleriert den Ausfall eines Datenträgers. RAID ist kein Ersatz für eine Datensicherung.'},
    dhcp:{k:['dhcp','dns','gateway','169.254','apipa','ip-adresse','ip adresse','ipconfig','namensauflösung','netzwerk'],q:'Was machen DHCP, DNS und das Standardgateway?',
     a:'DHCP vergibt automatisch die Netzwerkeinstellungen an einen Rechner: IP-Adresse, Subnetzmaske, Standardgateway und DNS-Server. DNS übersetzt Namen wie srv-files01 in IP-Adressen. Das Standardgateway ist der Router, über den der Rechner alle Ziele außerhalb des eigenen Subnetzes erreicht, also auch das Internet. Bekommt ein Windows-PC keine Antwort vom DHCP-Server, gibt er sich selbst eine Adresse aus 169.254.0.0/16 (APIPA). Damit erreicht er weder Server in anderen Netzen noch das Internet.',
     simple:'DHCP verteilt die Adressen, DNS ist das Telefonbuch, das Gateway ist die Tür nach draußen.',
     ex:'Ein neuer PC in der Buchhaltung zeigt bei ipconfig die Adresse 169.254.12.7. Er hat also keinen DHCP-Server erreicht. Prüf zuerst Kabel und Switch-Port, dann, ob der Port im richtigen VLAN ist. Bekommt der PC eine Adresse und klappt ein ping auf eine IP-Adresse im Internet, aber Webseiten öffnen sich nicht, liegt es meist am DNS.',
     src:'Modul 3 · Netzwerkdienste · S. 21',t:'DHCP, DNS und Gateway',
     pass:'DHCP weist Clients automatisch IP-Adresse, Subnetzmaske, Standardgateway und DNS-Server zu. DNS löst Hostnamen in IP-Adressen auf. Pakete an Ziele außerhalb des eigenen Subnetzes sendet der Client an das Standardgateway. Erhält ein Windows-Client keine DHCP-Antwort, konfiguriert er eine link-lokale Adresse aus 169.254.0.0/16 (APIPA).'},
    schutz:{k:['schutzziel','vertraulich','integrität','verfügbar','cia','informationssicherheit','schutzbedarf'],q:'Was sind die Schutzziele der Informationssicherheit?',
     a:'Die drei klassischen Schutzziele sind Vertraulichkeit, Integrität und Verfügbarkeit. Vertraulichkeit: Nur Berechtigte können Daten lesen, etwa durch Zugriffsrechte und Verschlüsselung. Integrität: Daten werden nicht unbemerkt verändert, etwa durch Prüfsummen, Signaturen und Protokollierung. Verfügbarkeit: Systeme und Daten sind nutzbar, wenn sie gebraucht werden, etwa durch Backups, USV und redundante Hardware. Bei einer Schutzbedarfsfeststellung schätzt du für jedes Schutzziel ein, wie groß der Schaden bei einer Verletzung wäre, meist in den Kategorien normal, hoch und sehr hoch.',
     simple:'Niemand Falsches liest mit, nichts wird heimlich geändert, und alles läuft, wenn du es brauchst.',
     ex:'Lohnabrechnungen brauchen hohe Vertraulichkeit. Die Artikelpreise im Webshop brauchen hohe Integrität, denn ein falscher Preis kostet Geld. Die Telefonanlage der Hotline braucht hohe Verfügbarkeit. Darum bekommt jedes System andere Maßnahmen.',
     src:'Modul 4 · Schutzziele · S. 5',t:'Schutzziele',
     pass:'Die Grundwerte der Informationssicherheit sind Vertraulichkeit, Integrität und Verfügbarkeit. Im Rahmen der Schutzbedarfsfeststellung wird für jeden Grundwert bewertet, welche Schäden bei einer Verletzung entstehen können, in der Regel in den Kategorien normal, hoch und sehr hoch.'},
    dsgvo:{k:['dsgvo','datenschutz','personenbezogen','einwilligung','betroffen','auskunft','löschen','datensparsam'],q:'Was muss ich zur DSGVO wissen?',
     a:'Die DSGVO schützt personenbezogene Daten, also alle Informationen, die sich auf eine identifizierte oder identifizierbare Person beziehen, etwa Name, E-Mail-Adresse oder Personalnummer. Verarbeiten darfst du sie nur mit einer Rechtsgrundlage, zum Beispiel zur Erfüllung eines Vertrags, wegen einer gesetzlichen Pflicht oder mit Einwilligung. Wichtige Grundsätze sind Zweckbindung, Datenminimierung und Speicherbegrenzung: nur so viele Daten wie nötig, nur für den festgelegten Zweck, nur so lange wie nötig. Betroffene haben unter anderem ein Recht auf Auskunft, Berichtigung und Löschung. Bei Fragen im Betrieb ist der oder die Datenschutzbeauftragte deine Anlaufstelle.',
     simple:'Daten über Menschen nur mit gutem Grund, nur so viele wie nötig und nur so lange wie nötig.',
     ex:'Für ein Gewinnspiel im Newsletter brauchst du Name und E-Mail-Adresse, aber nicht das Geburtsdatum. Ist das Gewinnspiel vorbei, löschst du die Teilnehmerdaten, sofern es keinen anderen Zweck und keine Rechtsgrundlage für die weitere Speicherung gibt.',
     src:'Modul 5 · Datenschutz · S. 6',t:'DSGVO-Grundlagen',
     pass:'Personenbezogene Daten sind alle Informationen, die sich auf eine identifizierte oder identifizierbare natürliche Person beziehen (Art. 4 DSGVO). Die Verarbeitung ist nur rechtmäßig, wenn eine Rechtsgrundlage nach Art. 6 DSGVO vorliegt. Zu den Grundsätzen gehören Zweckbindung, Datenminimierung und Speicherbegrenzung (Art. 5 DSGVO).'},
    backup:{k:['backup','datensicherung','inkrementell','differenziell','vollsicherung','sicherung','wiederherstell'],q:'Was ist der Unterschied zwischen voller, differenzieller und inkrementeller Sicherung?',
     a:'Eine Vollsicherung kopiert alle Daten. Sie braucht am meisten Zeit und Speicher, lässt sich aber am einfachsten wiederherstellen. Eine differenzielle Sicherung kopiert alles, was sich seit der letzten Vollsicherung geändert hat. Zum Wiederherstellen brauchst du die Vollsicherung und die letzte differenzielle Sicherung. Eine inkrementelle Sicherung kopiert nur, was sich seit der letzten Sicherung geändert hat, egal welcher Art. Sie ist am schnellsten, zum Wiederherstellen brauchst du aber die Vollsicherung und alle Inkremente danach, in der richtigen Reihenfolge.',
     simple:'Voll: alles. Differenziell: alles seit der letzten Vollsicherung. Inkrementell: nur das seit der letzten Sicherung.',
     ex:'Vollsicherung am Sonntag, Ausfall am Donnerstagmorgen. Mit differenziellen Sicherungen spielst du Sonntag und Mittwoch zurück. Mit inkrementellen Sicherungen brauchst du Sonntag, Montag, Dienstag und Mittwoch. Fehlt eine davon, ist die Wiederherstellung unvollständig.',
     src:'Modul 5 · Datensicherung · S. 14',t:'Sicherungsarten',
     pass:'Die Vollsicherung umfasst den gesamten Datenbestand. Die differenzielle Sicherung umfasst alle Änderungen seit der letzten Vollsicherung. Die inkrementelle Sicherung umfasst alle Änderungen seit der letzten Sicherung. Für die Wiederherstellung werden bei inkrementellen Verfahren die Vollsicherung und sämtliche folgenden Inkremente benötigt.'}
   },

    {type:'mc',topic:'DNS',q:'Welcher Dienst übersetzt den Namen srv-files01 in eine IP-Adresse?',o:['DHCP','DNS','NAT','ARP'],c:1,ex:'DNS löst Namen in IP-Adressen auf. ARP ermittelt zu einer IP-Adresse im lokalen Netz die MAC-Adresse.',src:'Modul 3 · S. 23'},
    {type:'mc',topic:'Subnetting',q:'Wie viele nutzbare Hostadressen hat ein /26-Netz?',o:['62','64','30','126'],c:0,ex:'6 Hostbits: 2 hoch 6 = 64 Adressen, minus Netz- und Broadcastadresse ergibt 62.',src:'Modul 3 · S. 25'},

    {type:'open',topic:'Fehlersuche im Netzwerk',q:'Ein PC hat eine gültige IP-Adresse und erreicht Server im eigenen Netz per IP. Webseiten im Internet öffnen sich aber nicht. Nenne zwei Einstellungen, die du prüfst, und warum.',need:2,

   copilot:{

    case:`Fallstudie: Der neue Arbeitsplatz in der Buchhaltung

   id:'onb',short:'Ausbildungsstart',mode:'Ausbildungsstart',title:'Ausbildungsstart',activeModule:'Ausbildungsstart',starters:['week1','bericht','absence'],
   qa:{
    week1:{k:['erste woche','ersten woche','erster tag','ersten tag','anfang','start','einarbeitung'],q:'Was muss ich in meiner ersten Woche wissen?',
     a:'In der ersten Woche richtest du mit der IT deinen Laptop und deine Zugänge ein, lernst dein Team kennen und besprichst mit deiner Ausbilderin den betrieblichen Ausbildungsplan. Sie zeigt dir, welche Stationen du im ersten Jahr durchläufst. Außerdem bekommst du die Unterweisungen zu Arbeitsschutz und Datenschutz. Ab der zweiten Woche führst du jede Woche dein Berichtsheft.',
     simple:'Zugänge einrichten, Team kennenlernen, Ausbildungsplan besprechen, Unterweisungen mitmachen.',
     ex:'Montag: Laptop und Zugänge. Dienstag: Rundgang und Kennenlernen im Team. Mittwoch: Gespräch zum Ausbildungsplan. Donnerstag und Freitag: Unterweisungen und dein erstes kleines Projekt im Entwicklungsteam.',
     src:'Azubi-Handbuch · Dein Start · S. 3',t:'Meine erste Woche',
     pass:'Woche 1: Ausgabe von Laptop und Zugängen, Vorstellung im Team, Besprechung des betrieblichen Ausbildungsplans mit der Ausbilderin, Unterweisungen zu Arbeitsschutz und Datenschutz. Das Berichtsheft wird ab Woche 2 wöchentlich geführt.'},
    bericht:{k:['berichtsheft','ausbildungsnachweis','nachweis','bericht','abzeichn','wochenbericht'],q:'Wie führe ich mein Berichtsheft richtig?',
     a:'Das Berichtsheft, also der Ausbildungsnachweis, dokumentiert, was du im Betrieb und in der Berufsschule gelernt hast. Bei uns führst du es wöchentlich und digital. Schreib kurz und konkret, welche Tätigkeiten du gemacht hast, welche Unterweisungen du bekommen hast und welche Themen in der Berufsschule dran waren. Deine Ausbilderin sieht es regelmäßig durch und zeichnet es ab. Du darfst es während der Arbeitszeit am Arbeitsplatz schreiben. Wichtig: Ohne ordnungsgemäß geführten Ausbildungsnachweis wirst du nicht zur Abschlussprüfung zugelassen.',
     simple:'Jede Woche kurz aufschreiben, was du im Betrieb und in der Schule gemacht hast. Deine Ausbilderin zeichnet ab. Ohne Berichtsheft keine Zulassung zur Abschlussprüfung.',
     ex:'Gut: „Datenbankschema für die Lagerverwaltung entworfen und bis zur 3NF normalisiert, 12 Std.“ Zu vage: „Am Computer gearbeitet.“ Der konkrete Eintrag zeigt dir später auch selbst, was du schon kannst.',
     src:'Azubi-Handbuch · Berichtsheft · S. 8',t:'Berichtsheft führen',
     pass:'Der Ausbildungsnachweis wird wöchentlich in digitaler Form geführt und von der Ausbilderin regelmäßig durchgesehen und abgezeichnet. Er kann während der Ausbildungszeit am Arbeitsplatz geführt werden. Ein ordnungsgemäß geführter Ausbildungsnachweis ist Voraussetzung für die Zulassung zur Abschlussprüfung.'},
    absence:{k:['krank','fehlen','abwesend','berufsschule','arzt','krankmeldung','attest'],q:'Was mache ich, wenn ich krank bin?',
     a:'Melde dich vor Arbeitsbeginn telefonisch bei deiner Ausbilderin oder deinem Team. Wenn du an einem Berufsschultag krank bist, informierst du zusätzlich die Berufsschule. Bei uns brauchst du ab dem dritten Krankheitstag eine ärztliche Bescheinigung. Verpasste Themen aus der Berufsschule holst du mit den Unterlagen deiner Klasse nach. Dabei kann ich dir helfen.',
     simple:'Vor Arbeitsbeginn Bescheid sagen, an Schultagen auch der Schule. Ab dem dritten Tag zum Arzt.',
     ex:'Du wachst am Dienstag mit Fieber auf, und Dienstag ist Berufsschultag. Du rufst um 7:30 Uhr im Betrieb an und meldest dich bei der Schule krank. Bist du am Donnerstag noch krank, gehst du zum Arzt.',
     src:'Azubi-Handbuch · Krankmeldung · S. 11',t:'Krank melden',
     pass:'Arbeitsunfähigkeit ist der Ausbilderin unverzüglich, möglichst vor Arbeitsbeginn, mitzuteilen. An Berufsschultagen ist zusätzlich die Berufsschule zu informieren. Ab dem dritten Krankheitstag ist eine ärztliche Bescheinigung vorzulegen.'}

    norm:{k:['normaliz','normalis','normal form','1nf','2nf','3nf','redundan','anomal','transitive','atomic'],q:'How do I normalize a table up to third normal form?',
     a:'Normalization removes redundancy, so that changes don’t create contradictions (anomalies). First normal form (1NF): every field holds a single atomic value, no lists. Second normal form (2NF): the table is in 1NF, and every non-key attribute depends on the whole primary key, not just part of it. This only matters for composite keys. Third normal form (3NF): the table is in 2NF, and no non-key attribute depends on the key transitively, through another non-key attribute. The fix is always the same: move the affected columns into their own table and link it with a foreign key.',
     simple:'Every fact is stored in exactly one place. 1NF: one value per field. 2NF: everything depends on the whole key. 3NF: nothing depends on the key by a detour.',
     ex:'The table Order(OrderNo, ItemNo, Quantity, ItemName, CustomerNo, CustomerCity) has the key OrderNo + ItemNo. ItemName depends only on ItemNo: that breaks 2NF, so it moves to an Item table. CustomerNo and CustomerCity depend only on OrderNo, so they move to an OrderHeader table. There, CustomerCity depends on the key through CustomerNo: that breaks 3NF, so it gets its own Customer table.',
     src:'Module 3 · Normalization · p. 12',t:'Normalization up to 3NF',
     pass:'A relation is in first normal form if all attributes contain only atomic values. It is in second normal form if it is in first normal form and every non-key attribute is fully functionally dependent on the entire primary key. It is in third normal form if it is in second normal form and no non-key attribute is transitively dependent on the primary key.'},
    join:{k:['join','inner','left','outer','combine','two tables','right join'],q:'What’s the difference between INNER JOIN and LEFT JOIN?',
     a:'An INNER JOIN returns only the rows that have a matching partner in both tables. A LEFT JOIN returns every row from the left table, even without a partner. Where the partner is missing, the right table’s columns are NULL. A RIGHT JOIN does the same from the other side. Rule of thumb: if you also need records without a counterpart, for example customers with no orders, use a LEFT JOIN.',
     simple:'INNER JOIN: only pairs. LEFT JOIN: everything from the left, plus whatever matches on the right.',
     ex:'SELECT c.Name, o.OrderNo FROM Customer c LEFT JOIN Orders o ON o.CustomerNo = c.CustomerNo; lists every customer. Anyone who has never ordered shows up with NULL as OrderNo. With an INNER JOIN, exactly those customers would be missing. Add WHERE o.OrderNo IS NULL and you get only the customers without orders.',
     src:'Module 3 · SQL queries · p. 27',t:'INNER JOIN vs. LEFT JOIN',
     pass:'An INNER JOIN returns only records for which the join condition is met in both tables. A LEFT (OUTER) JOIN additionally returns all records from the left table that have no matching record in the right table. The right table’s columns are then filled with NULL.'},
    oop:{k:['object-orient','object orient','oop','procedural','class','object','inheritance','encapsulation','polymorph'],q:'How is object-oriented programming different from procedural programming?',
     a:'Procedural programming splits a program into functions (procedures) that process data step by step. Data and functions are kept separate. Object-oriented programming bundles data (attributes) and behavior (methods) into classes, and you create objects from those classes. Key principles are encapsulation (data is only changed through methods), inheritance (a class takes over the features of another) and polymorphism (the same method behaves differently depending on the object). C is a typical procedural language; Java and C# are object-oriented.',
     simple:'Procedural: a recipe of steps. Object-oriented: things that know their own data and what they can do.',
     ex:'The warehouse tool has a class Item with the attributes number and stock and the method withdraw(quantity). The method checks that there’s enough stock before reducing it. Because stock is private, no other part of the program can set it to a negative value by accident. That’s encapsulation.',
     src:'Module 2 · Programming paradigms · p. 8',t:'Procedural vs. object-oriented',
     pass:'Procedural programming breaks a problem down into procedures that operate on separately held data. Object-oriented programming combines data and the methods that work on it into classes. Its central concepts are encapsulation, inheritance and polymorphism.'},
    unit:{k:['unit test','unittest','module test','junit','test case','assert','testing','test'],q:'What is a unit test, and how do I write one?',
     a:'A unit test checks the smallest testable unit, usually a method or class, in isolation from the rest of the system. A good test follows Arrange, Act, Assert: prepare the test data, call the method, compare the result with the expected value. Don’t only test the normal case; test boundary values and invalid input too. Because unit tests run automatically, you notice right away when a change breaks something. Typical tools are JUnit for Java and pytest for Python.',
     simple:'A unit test is a small check for one part of your program: same input, expected result, checked automatically.',
     ex:'For a method discount(amount) that gives 5 percent off from 100 euros, write at least three tests: 99.99 euros gives 0 euros discount, 100 euros gives 5 euros, and a negative amount raises an error. The test right at 100 euros catches the most bugs, such as a > instead of >=.',
     src:'Module 6 · Unit tests · p. 15',t:'Writing unit tests',
     pass:'Unit tests check individual components in isolation and automatically. A test case consists of preconditions, input values and the expected result. Besides normal cases, boundary values and invalid input should be tested in particular (boundary value analysis, equivalence classes).'},
    git:{k:['git','branch','merge','version control','commit','pull request','conflict','rebase'],q:'How do I work with branches in Git?',
     a:'A branch is a separate line of development. The main branch (often called main) holds the stable state. For each change you create a new branch, for example feature/csv-export, and commit there. When the change is done and tested, it’s merged into main, usually through a pull request with a code review. If two branches changed the same lines, you get a merge conflict that you resolve by hand. That way main always works, and every change can be traced.',
     simple:'A branch is a copy to try things out. When it’s right, it gets merged back into the main version.',
     ex:'git switch -c feature/csv-export creates your branch. After your commits, you push it and open a pull request. Your trainer reviews the code, the unit tests run automatically, then it’s merged. If a bug fix goes live on main at the same time, your work doesn’t affect it.',
     src:'Module 6 · Version control · p. 22',t:'Branches in Git',
     pass:'Branches allow changes to be developed in parallel and in isolation. The main branch holds the released state. Changes are combined by merging after review and successful tests. Competing changes to the same lines lead to merge conflicts, which are resolved manually.'},
    subnet:{k:['subnet','netmask','subnet mask','cidr','/24','/25','/26','/27','hosts','ipv4','broadcast'],q:'How do I split an IPv4 network into subnets?',
     a:'An IPv4 address has 32 bits. The prefix length, for example /24, tells you how many bits belong to the network part; the rest is the host part. To create subnets, you borrow bits from the host part: each borrowed bit doubles the number of subnets. Usable hosts per subnet are 2 to the power of the host bits, minus 2, because the first address identifies the network and the last one is the broadcast. Borrowing 2 bits from 192.168.10.0/24 gives four /26 networks with 62 usable addresses each.',
     simple:'You cut a big block of addresses into equal pieces. Each piece loses two addresses: one for the network, one for the broadcast.',
     ex:'192.168.10.0/26 has the mask 255.255.255.192. The four subnets start at .0, .64, .128 and .192. In the first one, .0 is the network address, .1 to .62 are hosts and .63 is the broadcast. If the development team needs 50 computers, a /26 is enough. For 70 you need a /25.',
     src:'Module 5 · IPv4 and subnetting · p. 19',t:'IPv4 subnetting',
     pass:'The number of host addresses in a subnet is 2 to the power of n, minus 2, where n is the number of host bits. The first address of a subnet is the network address and the last is the broadcast address. Neither can be assigned to a host.'},
    crypto:{k:['symmetric','asymmetric','encrypt','key pair','public key','private key','aes','rsa','hybrid','tls'],q:'What’s the difference between symmetric and asymmetric encryption?',
     a:'With symmetric encryption, sender and receiver use the same secret key to encrypt and decrypt. It’s fast, AES for example, but the key has to be shared securely. With asymmetric encryption, each side has a key pair: data encrypted with the public key can only be decrypted with the matching private key. That solves the key exchange problem but is much slower, RSA for example. In practice both are combined as hybrid encryption, as in TLS: an asymmetric method agrees on a session key, and the connection then runs symmetrically.',
     simple:'Symmetric: one key locks and unlocks, and both sides need a copy. Asymmetric: a mailbox. Anyone can drop something in, only the owner can open it.',
     ex:'When you open your company’s customer portal in the browser, the browser and server use an asymmetric method to agree on a shared key. Everything after that, pages and forms, is encrypted with that symmetric key, because it’s much faster.',
     src:'Module 4 · Encryption · p. 14',t:'Symmetric vs. asymmetric',
     pass:'Symmetric methods (such as AES) use one shared secret key and are suited to large amounts of data. Asymmetric methods (such as RSA) use a key pair consisting of a public and a private key. Hybrid methods use asymmetric cryptography for key exchange and symmetric cryptography for the actual data transfer.'},
    netz:{k:['network diagram','critical path','float','slack','project management','activity','pert','earliest','latest'],q:'How do I find the critical path in a project network diagram?',
     a:'A network diagram shows a project’s activities with their durations and dependencies. In the forward pass you work out each activity’s earliest start (ES) and earliest finish (EF). With several predecessors, the largest EF counts. In the backward pass you start from the project end and work out the latest finish (LF) and latest start (LS). With several successors, the smallest LS counts. Total float is LS minus ES. All activities with zero total float form the critical path: if one of them slips, the whole project slips.',
     simple:'The critical path is the longest chain of steps with no slack. Any delay on it delays the whole project.',
     ex:'Warehouse app project: A requirements (2 days), then in parallel B database (4 days) and C user interface (3 days), then D testing (2 days), which needs both B and C. B ends on day 6, C on day 5. So D starts after day 6 and ends on day 8. C has 1 day of float; the critical path is A, B, D.',
     src:'Module 1 · Network planning · p. 31',t:'Network diagram and critical path',
     pass:'The total float of an activity is LS minus ES, or LF minus EF. Activities with a total float of zero lie on the critical path. A delay in these activities delays the project’s end date.'}

   copilot:{
    quiz:`Warm-up quiz: Normalization (10 minutes)

1. The Phone column contains "040 123, 0170 456". Which normal form is broken?
   Answer: First normal form. A field may only hold one atomic value.

2. Position(OrderNo, ItemNo, Quantity, ItemName): what breaks 2NF here?
   Answer: ItemName depends only on ItemNo, so on only part of the key.

3. Employee(EmpNo, Name, DeptNo, DeptName): what breaks 3NF here?
   Answer: DeptName depends on EmpNo transitively, through DeptNo.

4. Which anomaly do you risk if the customer address is stored in every order?
   Answer: An update anomaly. If the address is changed in only some rows, the data contradicts itself.

Sources: Module 3 · Normalization · p. 12-16`,

   qa:{
    nutz:{k:['weighted','scoring','utility','offer','quote','compare','criteria','decision'],q:'How do I do a weighted scoring analysis?',
     a:'A weighted scoring analysis compares offers on several criteria, not just price. 1. Pick the criteria, for example price, performance, warranty and energy use. 2. Weight each criterion; the weights add up to 100 percent. 3. Score each offer on each criterion, say from 1 to 10. 4. Multiply score by weight and add up the results per offer. The offer with the highest total wins. Always give a short reason for your weights.',
     simple:'Give each criterion a weight, score each offer, multiply score by weight. The highest total wins.',
     ex:'Two laptops: price counts 40 percent, performance 35, warranty 25. Laptop A scores 8, 6 and 5: 3.2 + 2.1 + 1.25 = 6.55. Laptop B scores 6, 8 and 8: 2.4 + 2.8 + 2.0 = 7.2. B costs more but has the higher score.',
     src:'Module 1 · Comparing offers · p. 9',t:'Weighted scoring analysis',
     pass:'A weighted scoring analysis evaluates alternatives against weighted criteria. The weights add up to 100 percent. Each partial score is the degree of fulfillment times the weight; the total score is the sum of the partial scores.'},
    raid:{k:['raid','hard drive','disk','mirror','parity','redundan','striping','storage'],q:'Which RAID level fits which use?',
     a:'RAID combines several disks into one array. RAID 0 (striping) spreads data across at least two disks: fast, but with no fault tolerance. If one disk fails, all data is gone. RAID 1 (mirroring) copies the data to a second disk: one disk may fail, but only half the capacity is usable. RAID 5 needs at least three disks and spreads data plus parity information: one disk may fail, and you lose only one disk’s worth of capacity. Important: RAID is not a backup. Deleted or encrypted files are gone on every disk at once.',
     simple:'RAID 0 is fast but risky. RAID 1 is a real-time copy. RAID 5 is a good middle ground from three disks. None of them replaces a backup.',
     ex:'A server with four 4 TB disks in RAID 5 has 12 TB of usable space and survives one disk failing. The same disks as two RAID 1 pairs give only 8 TB. For a PC in accounting, a single SSD is usually enough if the data lives on the server and is backed up there.',
     src:'Module 2 · Storage solutions · p. 17',t:'RAID levels',
     pass:'RAID 0 spreads data across several drives without redundancy. RAID 1 mirrors data on two drives. RAID 5 spreads data and parity information across at least three drives and tolerates the failure of one drive. RAID is not a substitute for a backup.'},
    dhcp:{k:['dhcp','dns','gateway','169.254','apipa','ip address','ipconfig','name resolution','network'],q:'What do DHCP, DNS and the default gateway do?',
     a:'DHCP hands out network settings to a computer automatically: IP address, subnet mask, default gateway and DNS server. DNS translates names like srv-files01 into IP addresses. The default gateway is the router the computer uses to reach anything outside its own subnet, including the internet. If a Windows PC gets no answer from a DHCP server, it gives itself an address from 169.254.0.0/16 (APIPA). With that it can’t reach servers in other networks or the internet.',
     simple:'DHCP hands out the addresses, DNS is the phone book, the gateway is the door to the outside.',
     ex:'A new PC in accounting shows 169.254.12.7 in ipconfig. So it didn’t reach a DHCP server. Check the cable and the switch port first, then whether the port is in the right VLAN. If the PC gets an address and can ping an IP address on the internet, but websites won’t open, it’s usually DNS.',
     src:'Module 3 · Network services · p. 21',t:'DHCP, DNS and gateway',
     pass:'DHCP automatically assigns clients an IP address, subnet mask, default gateway and DNS server. DNS resolves host names to IP addresses. The client sends packets for destinations outside its own subnet to the default gateway. If a Windows client receives no DHCP response, it configures a link-local address from 169.254.0.0/16 (APIPA).'},
    schutz:{k:['protection goal','confidential','integrity','availab','cia','information security','protection requirement'],q:'What are the protection goals of information security?',
     a:'The three classic protection goals are confidentiality, integrity and availability. Confidentiality: only authorized people can read data, for example through access rights and encryption. Integrity: data isn’t changed without anyone noticing, for example through checksums, signatures and logging. Availability: systems and data can be used when they’re needed, for example through backups, a UPS and redundant hardware. In a protection requirements assessment, you estimate for each goal how much damage a breach would cause, usually in the categories normal, high and very high.',
     simple:'Nobody wrong reads along, nothing is changed in secret, and everything works when you need it.',
     ex:'Payroll data needs high confidentiality. Item prices in the web shop need high integrity, because a wrong price costs money. The hotline’s phone system needs high availability. That’s why each system gets different measures.',
     src:'Module 4 · Protection goals · p. 5',t:'Protection goals',
     pass:'The basic values of information security are confidentiality, integrity and availability. In the protection requirements assessment, the possible damage from a breach is assessed for each basic value, usually in the categories normal, high and very high.'},
    dsgvo:{k:['gdpr','dsgvo','data protection','personal data','consent','data subject','access request','delete','minimi'],q:'What do I need to know about the GDPR?',
     a:'The GDPR (DSGVO in German) protects personal data: any information about an identified or identifiable person, such as a name, email address or staff number. You may only process it with a legal basis, for example to fulfill a contract, because of a legal obligation, or with consent. Key principles are purpose limitation, data minimization and storage limitation: only as much data as needed, only for the stated purpose, only for as long as needed. Data subjects have rights including access, rectification and erasure. At work, the data protection officer is your contact for questions.',
     simple:'Data about people only with a good reason, only as much as needed, and only for as long as needed.',
     ex:'For a newsletter prize draw you need a name and email address, but not the date of birth. Once the draw is over, you delete the entrants’ data, unless there’s another purpose and a legal basis for keeping it.',
     src:'Module 5 · Data protection · p. 6',t:'GDPR basics',
     pass:'Personal data means any information relating to an identified or identifiable natural person (Art. 4 GDPR). Processing is lawful only if there is a legal basis under Art. 6 GDPR. The principles include purpose limitation, data minimization and storage limitation (Art. 5 GDPR).'},
    backup:{k:['backup','incremental','differential','full backup','restore','recovery'],q:'What’s the difference between full, differential and incremental backups?',
     a:'A full backup copies all data. It takes the most time and space but is the easiest to restore. A differential backup copies everything that changed since the last full backup. To restore, you need the full backup and the latest differential one. An incremental backup copies only what changed since the last backup of any kind. It’s the fastest, but to restore you need the full backup and every increment after it, in the right order.',
     simple:'Full: everything. Differential: everything since the last full backup. Incremental: only what changed since the last backup.',
     ex:'Full backup on Sunday, failure on Thursday morning. With differential backups you restore Sunday and Wednesday. With incremental backups you need Sunday, Monday, Tuesday and Wednesday. If one of them is missing, the restore is incomplete.',
     src:'Module 5 · Backup · p. 14',t:'Backup types',
     pass:'A full backup covers the entire data set. A differential backup covers all changes since the last full backup. An incremental backup covers all changes since the last backup. Restoring from incremental backups requires the full backup and all subsequent increments.'}

function setStage(){
 const st=document.getElementById('stage');if(!st)return;
 st.classList.toggle('speaking',S.speaking);st.classList.toggle('listening',S.listening);

 const mic=document.querySelector('.mic');if(mic)mic.classList.toggle('on',S.listening);

function matchQA(text){
 const c=C(),t=' '+text.toLowerCase()+' ';let best=null,score=0;
 for(const [id,qa] of Object.entries(c.qa)){let s=0;qa.k.forEach(k=>{if(t.includes(k))s+=k.length>4?2:1});if(s>score){score=s;best=id}}
 return score>0?best:null;
}
function ask(text,forced){
 if(S.busy)return;
 const c=C(),msgs=S.chats[S.course];
 if(S.view!=='tutor'){S.view='tutor';render()}
 let reply;
 if(forced==='quiz'){
  msgs.push({role:'user',text:T.quizMe});
  reply={role:'ai',kind:'quiz',items:(c.practice||COURSES.fiae.practice).filter(p=>p.type==='mc').slice(0,3),ans:[null,null,null]};
 }else if(forced==='example'||forced==='simple'){
  const qa=c.qa[S.last[S.course]];
  msgs.push({role:'user',text:forced==='example'?T.chipEx:T.chipSimple});
  reply={role:'ai',kind:'answer',text:forced==='example'?qa.ex:qa.simple,src:qa.src,pass:qa.pass};
 }else{
  msgs.push({role:'user',text});
  const id=matchQA(text);
  if(id){S.last[S.course]=id;if(!S.asked[S.course].includes(id))S.asked[S.course].push(id);const qa=c.qa[id];reply={role:'ai',kind:'answer',text:qa.a,src:qa.src,pass:qa.pass}}
  else reply={role:'ai',kind:'nomatch',text:T.noMatch(c.qa[c.starters[0]].q)};
 }
 S.busy=true;
 msgs.push({role:'ai',kind:'typing'});redrawThread();
 setTimeout(()=>{
  msgs.pop();msgs.push(reply);
  const idx=msgs.length-1;redrawThread();
  if(msgs.filter(m=>m.role==='ai').length%2===0){S.minutes[S.course]=Math.min(S.tutor.minutes,S.minutes[S.course]+1);renderTop()}
  if(reply.kind==='quiz'){S.busy=false;return}
  streamInto(idx,reply.text,()=>{S.busy=false});
  speak(reply.text);
 },reduce?50:650);
}
function streamInto(idx,text,done){
 const el=document.querySelector(`[data-mi="${idx}"]`);
 if(!el||reduce){done();return}
 const words=text.split(' ');let n=0;el.textContent='';
 const src=el.parentElement.querySelector('.src,.nomatch');if(src)src.style.visibility='hidden';
 const tick=setInterval(()=>{n+=2;el.textContent=words.slice(0,n).join(' ');scrollChat();if(n>=words.length){clearInterval(tick);if(src)src.style.visibility='';scrollChat();done()}},45);
}
let speakTimer;
function speak(text){
 clearTimeout(speakTimer);
 const fallback=()=>{S.speaking=true;setStage();speakTimer=setTimeout(()=>{S.speaking=false;setStage()},Math.min(9000,text.length*28))};
 if(!S.voiceOut||!('speechSynthesis' in window)){fallback();return}
 try{
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const pref=S.tutor.voice,lang=K.voiceLang(pref);u.lang=lang;
  const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.replace('_','-').startsWith(lang.slice(0,5)));
  if(vs.length)u.voice=vs[pref===1&&vs[1]?1:0];
  u.rate=pref===1?.95:pref===3?1.1:1.02;
  u.onstart=()=>{S.speaking=true;setStage()};
  u.onend=u.onerror=()=>{S.speaking=false;setStage()};
  speechSynthesis.speak(u);
  speakTimer=setTimeout(()=>{if(!speechSynthesis.speaking){fallback()}},700);
 }catch(e){fallback()}
}
function stopSpeaking(){clearTimeout(speakTimer);try{speechSynthesis.cancel()}catch(e){}S.speaking=false;setStage()}
function listen(){
 if(S.listening||S.busy)return;
 stopSpeaking();
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 let handled=false;
 const simulate=()=>{
  if(handled)return;handled=true;
  const c=C();const next=c.starters.concat(Object.keys(c.qa)).find(k=>!S.asked[S.course].includes(k))||c.starters[0];
  const q=c.qa[next].q;const inp=document.getElementById('q');
  S.listening=true;setStage();
  let n=0;const words=q.split(' ');
  const tick=setInterval(()=>{n++;if(inp)inp.value=words.slice(0,n).join(' ');if(n>=words.length){clearInterval(tick);setTimeout(()=>{S.listening=false;setStage();if(inp)inp.value='';ask(q)},350)}},reduce?1:140);
 };
 if(!SR){simulate();return}
 try{
  const r=new SR();r.lang=K.srLang;r.interimResults=true;r.maxAlternatives=1;
  let finalText='';
  S.listening=true;setStage();
  r.onresult=e=>{let t='';for(const res of e.results)t+=res[0].transcript;finalText=t;const inp=document.getElementById('q');if(inp)inp.value=t};
  r.onerror=()=>{S.listening=false;setStage();simulate()};
  r.onend=()=>{if(handled)return;S.listening=false;setStage();if(finalText.trim()){handled=true;const inp=document.getElementById('q');if(inp)inp.value='';ask(finalText.trim())}else simulate()};
  r.start();
  setTimeout(()=>{if(!handled&&!finalText){try{r.abort()}catch(err){}S.listening=false;simulate()}},4000);
 }catch(e){S.listening=false;simulate()}
}

 });

 });

  case 'savetutor':readTutorFields();persist();render();toast(T.savedTutor);break;
  case 'swatch':S.brand.color=t.dataset.c==='#6D28D9'?'':t.dataset.c;persist();render();if(document.getElementById('brand-modal')||S.view!=='branding')brandModal();break;
  case 'resetbrand':S.brand=Object.assign({},DEF.brand);persist();render();brandModal();toast(T.brandRestored);break;
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeModal();
 if(e.key==='Enter'){const r=e.target.closest&&e.target.closest('tr[data-act="learner"]');if(r)learnerModal(+r.dataset.i)}
});
document.addEventListener('submit',e=>{
 if(e.target.id==='composer'){e.preventDefault();const inp=document.getElementById('q');const v=inp.value.trim();if(!v)return;inp.value='';stopSpeaking();ask(v)}
});
document.addEventListener('input',e=>{
 const id=e.target.id;
 if(id==='b-name'){S.brand.name=e.target.value||T.yourCompany;S.brand.slug=slugify(S.brand.name);if(!S.brand._initTouched)S.brand.initial=(S.brand.name.trim()[0]||'A').toUpperCase();persist();renderSide();const bp=document.querySelector('.brand-prev');if(bp){bp.querySelector('b').textContent=S.brand.name;bp.querySelector('.muted').textContent=S.brand.slug;bp.querySelector('.logo').textContent=S.brand.initial}const bi=document.getElementById('b-init');if(bi&&!S.brand._initTouched)bi.value=S.brand.initial}
 if(id==='b-init'){S.brand._initTouched=true;S.brand.initial=e.target.value.toUpperCase();persist();renderSide();const l=document.querySelector('.brand-prev .logo');if(l)l.textContent=S.brand.initial}
 if(id==='b-color'){S.brand.color=e.target.value;persist();applyBrand();document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('on'))}
 if(id==='openans'){S.practice[S.course].open=e.target.value}
});
document.addEventListener('change',e=>{
 const a=e.target.dataset&&e.target.dataset.act;
 if(a==='upload'&&e.target.files.length){addUploads(e.target.files);e.target.value=''}
 if(a==='roster'&&e.target.files.length){toast(T.rosterToast(e.target.files[0].name));e.target.value=''}
});
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');if(ev==='drop'&&e.dataTransfer.files.length)addUploads(e.dataTransfer.files)}}));

function readTutorFields(){
 const n=document.getElementById('t-name'),v=document.getElementById('t-voice'),m=document.getElementById('t-min');
 if(n)S.tutor.name=(n.value.trim()||'Alex').slice(0,20);
 if(v)S.tutor.voice=+v.value;
 if(m)S.tutor.minutes=Math.max(5,Math.min(600,+m.value||45));
}
function runGen(){
 const o=S.outputs[S.course];if(!o)return;
 const el=document.getElementById('outtext');if(!el){o.done=true;return}
 el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});
 if(reduce){el.textContent=o.text;o.done=true;return}
 let n=0;const txt=o.text;clearInterval(runGen._t);
 runGen._t=setInterval(()=>{n+=9;el.textContent=txt.slice(0,n);if(n>=txt.length){clearInterval(runGen._t);o.done=true}},16);
}
function copyText(text,msg){
 const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg)}catch(e){toast(T.selectToCopy)}ta.remove()};
 try{navigator.clipboard.writeText(text).then(()=>toast(msg),fallback)}catch(e){fallback()}
}

/* ---------- Boot ---------- */
document.documentElement.lang=LANG;
document.title=T.htmlTitle;
const side=document.getElementById('side'),top=document.getElementById('top'),main=document.getElementById('main'),footnote=document.getElementById('footnote');
side.setAttribute('aria-label',T.navAria);
const all=Object.values(ROUTES).flat();
const h=(location.hash||'').slice(1);
if(all.includes(h)){S.view=h;S.role=Object.keys(ROUTES).find(r=>ROUTES[r].includes(h));if(h==='tutor')S.voiceMode=true;if(isSoon())S.upcoming=true}
// Personalized links: ?academy=Muster+Technik+GmbH&color=1D4ED8&letter=M (not saved). ?company= works too.
try{const an=(QS.get('academy')||QS.get('company')||'').trim(),col=(QS.get('color')||'').replace('#','');
 if(an){S.brand.name=an.slice(0,40);S.brand.slug=slugify(S.brand.name);S.brand.initial=((QS.get('letter')||an[0])+'').slice(0,2).toUpperCase()}
 if(/^[0-9a-f]{6}$/i.test(col))S.brand.color='#'+col;
}catch(e){}
if('speechSynthesis' in window){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}}
render();
})();
</script>
</body>
</html>
