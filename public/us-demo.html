<!doctype html>
<!-- Built from the interactive demo prototype. Personalize with ?academy=Name&color=1D4ED8&letter=N -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LearnSlice Tutor Demo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: app shell — fixed sidebar (workspace, courses, roles) + scrolling work area; collapses to a drawer on phones. Follows the LearnSlice product design (violet accent, quiet greys, dark tutor stage). */
:root{
  --bg:#FFFFFF; --panel:#FAF9FD; --surface:#FFFFFF; --sunken:#F4F3F8;
  --line:#E8E6EF; --line-strong:#D7D4E1;
  --fg:#16141D; --muted:#676478; --faint:#9895A7;
  --accent-default:#6D28D9; --accent:var(--accent-default); --on-accent:#FFFFFF;
  --good:#15803D; --good-soft:#E7F5EC; --warn:#B45309; --warn-soft:#FCF1E1; --bad:#B42318; --bad-soft:#FDECEA;
  --xp:#F59E0B; --stage:#17151F; --stage-2:#221F2E; --stage-fg:#F4F2FA; --stage-muted:#A9A5BA;
  --shadow:0 1px 2px rgba(22,18,40,.05),0 6px 20px rgba(22,18,40,.06);
  --f-ui:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-serif:"Newsreader",Georgia,"Times New Roman",serif;
  --r:12px; --r-lg:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111016; --panel:#15141B; --surface:#1B1A22; --sunken:#201F28;
  --line:#2A2833; --line-strong:#3A3846;
  --fg:#EEEBF5; --muted:#A7A3B6; --faint:#78758A;
  --accent-default:#8B5CF6;
  --good:#4ADE80; --good-soft:#15291C; --warn:#FBBF24; --warn-soft:#2C2313; --bad:#F87171; --bad-soft:#2E1717;
  --stage:#0C0B11; --stage-2:#17151F; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111016; --panel:#15141B; --surface:#1B1A22; --sunken:#201F28;
  --line:#2A2833; --line-strong:#3A3846;
  --fg:#EEEBF5; --muted:#A7A3B6; --faint:#78758A;
  --accent-default:#8B5CF6;
  --good:#4ADE80; --good-soft:#15291C; --warn:#FBBF24; --warn-soft:#2C2313; --bad:#F87171; --bad-soft:#2E1717;
  --stage:#0C0B11; --stage-2:#17151F; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}
:root{--accent-soft:color-mix(in srgb,var(--accent) 11%,var(--surface));--accent-line:color-mix(in srgb,var(--accent) 30%,var(--line));--accent-ink:color-mix(in srgb,var(--accent) 82%,var(--fg))}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14.5px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.015em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:268px minmax(0,1fr);height:100%}
/* Sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.ws{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.ws b{display:block;font-size:14.5px;line-height:1.2}
.ws small{color:var(--muted);font-size:12px}
.xp{padding:4px 16px 14px}
.xp-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.xp-row span:last-child{color:var(--muted);font-weight:500}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--xp);border-radius:9px}
.nav{display:flex;flex-direction:column;gap:2px;padding:4px 10px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:8px 10px;border-radius:9px;text-align:left;font-weight:500;color:var(--fg)}
.nav button:hover{background:var(--sunken)}
.nav button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.pill.soon{background:none;border:1px dashed var(--line-strong);color:var(--muted)}
.nav .new.soon{background:none;border:1px dashed var(--line-strong);color:var(--muted);font-weight:600}
.up{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 6px 4px 12px;background:var(--surface)}
.up .sw{width:36px;height:20px}
.up .sw::after{width:14px;height:14px}
.up .sw.on::after{transform:translateX(16px)}
.soon-bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 16px;background:var(--sunken);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.nav .new{margin-left:auto;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink);padding:1px 7px;border-radius:99px}
.side-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:18px 20px 6px}
.courses{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.courses button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:9px;text-align:left;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.courses button:hover{background:var(--sunken)}
.courses button.on{color:var(--accent-ink)}
.courses .cnt{margin-left:auto;font-weight:600;color:var(--faint)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;background:var(--sunken);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.who b{display:block;font-size:13.5px;line-height:1.2}
.who small{color:var(--muted);font-size:12px}
.powered{font-size:11.5px;color:var(--faint)}
.powered b{color:var(--muted)}

/* Main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 24px;border-bottom:1px solid var(--line);min-height:56px;flex-wrap:wrap}
.crumb{font-weight:600;display:flex;gap:8px;align-items:center;min-width:0}
.crumb span{color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg-label{font-size:12px;color:var(--faint);font-weight:600}
.demo-pill{font-size:12px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:99px;padding:3px 10px}
.scroll{flex:1;overflow-y:auto;min-height:0}
.foot-note{border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center;padding:10px 16px}
.page{padding-block:32px 48px;padding-inline:24px;max-width:1120px;margin:0 auto}
.narrow{max-width:720px}

/* Generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:9px 18px;font-weight:600;font-size:14px;color:var(--fg);transition:background .15s,border-color .15s}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.sm{padding:6px 13px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.pill.mute{background:var(--sunken);color:var(--muted)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.h1{font-size:30px;font-weight:800;line-height:1.15}
.h2{font-size:22px;font-weight:800}
.h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600}
.input,.select,.textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
.textarea{min-height:96px;resize:vertical;line-height:1.5}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:6px}
.src b{font-weight:600;background:var(--accent-soft);color:var(--accent-ink);padding:1px 8px;border-radius:99px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Home */
.home{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.spark{width:60px;height:60px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.spark svg{width:26px;height:26px}
.continue{width:100%;background:var(--accent);color:var(--on-accent);border:0;border-radius:99px;padding:14px 22px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px;text-align:left}
.continue span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.continue:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.sugg{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left}
.sugg button{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;width:100%}
.sugg button:hover{border-color:var(--accent-line)}
.sugg .ic{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.sugg .tx{flex:1;min-width:0}
.sugg .tx small{display:flex;gap:8px;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sugg .arrow{color:var(--faint)}

/* Tutor */
.tutor-wrap{display:flex;flex-direction:column;height:100%;min-height:0}
.tutor-scroll{flex:1;overflow-y:auto;min-height:0}
.tutor-inner{max-width:760px;margin:0 auto;padding:20px 24px 12px;display:flex;flex-direction:column;gap:18px}
.stage{position:relative;background:var(--stage);color:var(--stage-fg);border-radius:18px;overflow:hidden;height:250px;display:grid;place-items:center;flex:none}
.stage .tl,.stage .tr,.stage .bl,.stage .br{position:absolute;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.stage .tl{top:14px;left:14px}.stage .tr{top:14px;right:14px}.stage .bl{bottom:14px;left:16px;flex-direction:column;align-items:flex-start;gap:0}.stage .br{bottom:14px;right:14px}
.chip-dark{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);padding:3px 10px;border-radius:99px;color:var(--stage-fg)}
.live-dot{width:7px;height:7px;border-radius:50%;background:#4ADE80;display:inline-block}
.stage .bl b{font-size:15px}.stage .bl small{color:var(--stage-muted);font-size:12px}
.orb{width:128px;height:128px;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--accent) 35%,#fff),var(--accent) 55%,color-mix(in srgb,var(--accent) 60%,#000));box-shadow:0 0 60px color-mix(in srgb,var(--accent) 55%,transparent);transition:transform .3s}
.orb::before,.orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);opacity:.0}
.speaking .orb{animation:pulse 1.1s ease-in-out infinite}
.speaking .orb::before{animation:ring 1.6s ease-out infinite}
.speaking .orb::after{animation:ring 1.6s .8s ease-out infinite}
.listening .orb{transform:scale(.9)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes ring{0%{opacity:.7;transform:scale(.95)}100%{opacity:0;transform:scale(1.35)}}
.wave{display:flex;gap:4px;align-items:center;height:28px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity .2s}
.listening .wave{opacity:1}
.wave i{width:4px;border-radius:4px;background:var(--stage-muted);height:6px}
.listening .wave i{animation:wv .9s ease-in-out infinite;background:#fff}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes wv{0%,100%{height:6px}50%{height:24px}}
.illu svg{width:150px;height:150px}
.speaking .illu .mouth{animation:mouth .35s ease-in-out infinite}
@keyframes mouth{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.illu .mouth{transform-origin:75px 84px;transform-box:view-box}
.silhouette{width:170px;height:190px;border-radius:14px;background:linear-gradient(180deg,var(--stage-2),var(--stage));display:grid;place-items:end center;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.silhouette svg{width:150px;height:170px}
.thread{display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg.user{justify-content:flex-end}
.bubble{max-width:min(560px,100%);padding:11px 15px;border-radius:16px;line-height:1.55;min-width:0;overflow-wrap:anywhere}
.msg.user .bubble{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px}
.msg.ai .bubble{background:var(--sunken);border-bottom-left-radius:6px}
.msg .av{width:28px;height:28px;background:var(--fg);color:var(--bg);border:0;font-size:12px}
.msg.ai .stack{min-width:0}
.nomatch{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--warn);margin-top:6px;font-weight:600}
.cq{display:flex;flex-direction:column;gap:14px}
.cq .q{font-weight:600}
.cq .opts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.opt{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:left;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent-line)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:500}
.chips button:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.composer-wrap{border-top:1px solid var(--line);padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px))}
.composer{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:99px;padding:6px 6px 6px 18px;background:var(--surface)}
.composer input{flex:1;border:0;background:none;outline:none;min-width:0;padding:6px 0}
.mic{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.mic.on{animation:pulse 1s infinite}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn.on{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.meter{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:12.5px;color:var(--muted)}
.meter .bar{width:44px;margin:0;height:4px}
.meter .bar>i{background:var(--accent)}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

/* Plan */
.plan-list{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.mod{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);flex-wrap:wrap}
.mod .n{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--sunken);color:var(--muted);flex:none}
.mod.done .n{background:var(--good-soft);color:var(--good)}
.mod.active .n{background:var(--accent-soft);color:var(--accent-ink)}
.mod .tx{flex:1;min-width:180px}
.mod .tx b{display:block}
.mod .tx small{color:var(--muted)}
.mod.open .tx b{color:var(--muted)}
.plan-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.plan-head .pct{color:var(--accent-ink);font-weight:800}
.bar.acc>i{background:var(--accent)}

/* Practice */
.qcard{padding:24px;display:flex;flex-direction:column;gap:14px;margin-top:20px}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qtext{font-size:18px;font-weight:700;line-height:1.4}
.fb{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.fb.good{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb.part{background:var(--warn-soft)}
.fb b{font-weight:700}
.rub{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.rub div{display:flex;gap:8px;align-items:flex-start}
.rub .ok{color:var(--good)}.rub .no{color:var(--bad)}
.score-big{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}
.steps{display:flex;gap:4px}
.steps i{height:4px;flex:1;border-radius:4px;background:var(--line)}
.steps i.done{background:var(--accent)}

/* Instructor */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.kpi{padding:16px}
.kpi small{color:var(--muted);font-size:12.5px;font-weight:600}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.kpi span{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-top:16px}
.panel{padding:20px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.mastery{display:flex;flex-direction:column;gap:12px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:4px 12px;align-items:center}
.mrow .lbl{font-size:13.5px;font-weight:500;display:flex;gap:8px;align-items:center;min-width:0}
.mrow .lbl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .v{text-align:right;font-weight:700;font-size:13px}

.toggle .tx{flex:1;min-width:0}
.toggle small{display:block;color:var(--muted);font-size:12.5px}
.sw{width:42px;height:24px;border-radius:99px;background:var(--line-strong);border:0;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(18px)}
.sw:disabled{opacity:.85;cursor:not-allowed}

.fields2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pres{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:10px}

.pres small{color:var(--muted);font-size:12px;line-height:1.35}

input[type=color]{width:40px;height:36px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);padding:2px}
.brand-prev{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}

.cert-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:22px;flex-wrap:wrap}
.sign{border-top:1px solid var(--line-strong);padding-top:8px;min-width:220px}
.sign b{display:block}

.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:10px}
.acard{padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.acard .meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.acard p{font-size:13px;color:var(--muted)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:24px;flex-wrap:wrap}
.page-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}

.log .card{padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.log ul{margin:0;padding-left:18px}
.log li{margin:3px 0}

    a:'An IDS (intrusion detection system) watches traffic and raises an alert when it sees something suspicious. It’s passive and usually sits out of band, on a mirrored port. An IPS (intrusion prevention system) sits inline, so it can also block or drop the traffic. The trade-off: an IPS stops attacks in real time, but a false positive can block legitimate traffic.',
    simple:'An IDS is a security camera: it records and alerts. An IPS is a guard at the door: it can stop someone from coming in.',
    ex:'If your office network sees a burst of login attempts against the file server, an IDS sends an alert to the security team. An IPS in the same spot would drop the traffic from that source right away.',
    src:'Module 3 · Network appliances · p. 31'},
   zt:{k:['zero trust','zerotrust','implicit trust','policy engine','trust'],q:'What is zero trust?',
    a:'Zero trust means no user or device is trusted just because it’s inside the network. Every request is checked: who is asking, from which device, for which resource, and whether that fits policy. The exam objectives describe a control plane (policy engine and policy administrator) that makes the decision, and a data plane where a policy enforcement point applies it.',
    simple:'Old model: once you’re in the building, every door opens. Zero trust: you show your badge at every door, every time.',
    ex:'A contractor logs in from a personal laptop. Under zero trust they might reach the ticketing tool but not the finance share, because the device isn’t managed, even though the password was correct.',

   phish:{k:['phishing','social engineering','pretext','vishing','smishing','whaling'],q:'How do phishing, vishing and smishing differ?',
    a:'All three trick people into giving up access or information. Phishing uses email, vishing uses voice calls, and smishing uses text messages. Spear phishing targets one person with researched details, and whaling targets executives. The defenses follow the same idea: awareness training, confirming requests through a second channel, and technical controls like email filtering.',
    simple:'Same trick, different channel: email is phishing, a phone call is vishing, a text message is smishing.',
    ex:'A text saying “Your payroll account is locked, log in here” is smishing. The right move is to open the payroll site yourself instead of the link, and report the text to IT.',

   seg:{k:['segment','vlan','dmz','screened subnet','microsegment','lateral'],q:'Why do we segment networks?',
    a:'Segmentation splits a network into zones so a problem in one zone doesn’t spread to the rest. You can use VLANs, firewalls between zones, or a screened subnet (DMZ) for public-facing servers. It limits lateral movement, makes monitoring easier, and helps with compliance, for example by keeping payment systems separate.',

  copilot:{
   quiz:`Warm-up quiz: PKI and certificates (10 minutes)

1. What does a certificate authority sign, and why does that matter?
   Answer: It signs a certificate that binds a name to a public key, so others can trust that the key belongs to that name.

2. Your browser shows a warning for a certificate that expired last night. Which part of the check failed?
   Answer: The validity period. The chain can be fine and the certificate still rejected.

3. OCSP or CRL: which one gives a real-time answer for a single certificate?
   Answer: OCSP. A CRL is a periodically published list.

4. A server sends only its own certificate, not the intermediate. What will some clients report?
   Answer: An incomplete chain; they can't link the certificate to a trusted root.

Sources: Module 3 · PKI and certificates · p. 22–26`,

function streamInto(idx,text,done){

let speakTimer;
function speak(text){
 clearTimeout(speakTimer);
 const fallback=()=>{S.speaking=true;setStage();speakTimer=setTimeout(()=>{S.speaking=false;setStage()},Math.min(9000,text.length*28))};
 if(!S.voiceOut||!('speechSynthesis' in window)){fallback();return}
 try{
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const pref=S.tutor.voice,lang=pref===2?'en-GB':'en-US';u.lang=lang;
  const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.replace('_','-').startsWith(lang.slice(0,5)));
  if(vs.length)u.voice=vs[pref===1&&vs[1]?1:0];
  u.rate=pref===1?.95:pref===3?1.1:1.02;
  u.onstart=()=>{S.speaking=true;setStage()};
  u.onend=u.onerror=()=>{S.speaking=false;setStage()};
  speechSynthesis.speak(u);
  speakTimer=setTimeout(()=>{if(!speechSynthesis.speaking){fallback()}},700);
 }catch(e){fallback()}
}

function listen(){

 stopSpeaking();
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 let handled=false;
 const simulate=()=>{
  if(handled)return;handled=true;
  const c=C();const next=c.starters.concat(Object.keys(c.qa)).find(k=>!S.asked[S.course].includes(k))||c.starters[0];
  const q=c.qa[next].q;const inp=document.getElementById('q');

  const tick=setInterval(()=>{n++;if(inp)inp.value=words.slice(0,n).join(' ');if(n>=words.length){clearInterval(tick);setTimeout(()=>{S.listening=false;setStage();if(inp)inp.value='';ask(q)},350)}},reduce?1:140);
 };
 if(!SR){simulate();return}
 try{
  const r=new SR();r.lang='en-US';r.interimResults=true;r.maxAlternatives=1;
  let finalText='';
  S.listening=true;setStage();
  r.onresult=e=>{let t='';for(const res of e.results)t+=res[0].transcript;finalText=t;const inp=document.getElementById('q');if(inp)inp.value=t};
  r.onerror=()=>{S.listening=false;setStage();simulate()};
  r.onend=()=>{if(handled)return;S.listening=false;setStage();if(finalText.trim()){handled=true;const inp=document.getElementById('q');if(inp)inp.value='';ask(finalText.trim())}else simulate()};
  r.start();
  setTimeout(()=>{if(!handled&&!finalText){try{r.abort()}catch(err){}S.listening=false;simulate()}},4000);
 }catch(e){S.listening=false;simulate()}
}

function addUploads(files){
 const list=S.uploads[S.course],base=C().materials.length;
 Array.from(files).slice(0,6).forEach(f=>{
  const kb=Math.max(1,Math.round(f.size/1024));
  const item={n:f.name,s:kb>1024?(kb/1024).toFixed(1)+' MB':kb+' KB',p:Math.max(12,Math.round(kb/9)),st:'busy',prog:5,step:'Reading file'};
  list.push(item);
 });
 render();
 list.forEach((item,j)=>{
  if(item.st!=='busy'||item.run)return;item.run=true;
  const steps=[[25,'Reading file'],[55,'Splitting into passages'],[85,'Indexing for search'],[100,'Ready']];let k=0;
  const t=setInterval(()=>{
   const [p,s]=steps[k];item.prog=p;item.step=s;
   const idx=base+j;const bar=document.getElementById('upbar-'+idx),st=document.getElementById('upst-'+idx);
   if(bar)bar.style.width=p+'%';if(st)st.textContent=s;
   k++;if(k>=steps.length){clearInterval(t);item.st='ready';if(S.view==='materials')render();toast(`${item.n} is ready for the tutor`)}
  },reduce?50:900);
 });
}

  <div class="set-head">
   <div class="set-prev ${S.speaking?'speaking':''}">${tu.pres==='text'?'<span style="color:var(--stage-muted);font-size:13px">Text only</span>':stageInner(tu.pres)}</div>
   <div class="stack" style="gap:14px">

  <p class="muted" style="font-size:12.5px;margin-top:12px;display:flex;gap:8px">${ic('alert')}A custom avatar can be made from a video recording of a real presenter, only with that person’s written consent.</p>

 const b=S.brand,cur=b.color||'';
 return `<div class="page" style="max-width:760px">
  <h1 class="h2">Branding</h1>
  <p class="muted" style="margin-top:4px">The platform, tutor and certificates carry your academy’s name and color. Changes apply right away.</p>
  <div class="stack" style="gap:16px;margin-top:20px">
   <div class="fields2">
    <div class="field"><label for="b-name">Academy name</label><input class="input" id="b-name" value="${esc(b.name)}" maxlength="40"></div>

function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,28)||'academy'}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
 if(S.sideOpen&&!e.target.closest('#side')&&!e.target.closest('.menu-btn')){S.sideOpen=false;renderSide()}
 const t=e.target.closest('[data-act]');if(!t)return;
 const a=t.dataset.act;
 switch(a){
  case 'nav':{const v=t.dataset.v;if(v==='tutor'&&S.course==='onb')S.course='sec';go(v,v==='tutor'?{voice:true}:undefined);break}
  case 'role':{S.role=t.dataset.r;stopSpeaking();if(S.course==='onb')S.course='sec';go(HOME[S.role]);break}
  case 'upcoming':{e.preventDefault();S.upcoming=!S.upcoming;stopSpeaking();if(!S.upcoming&&isSoon()){S.voiceMode=false;go(HOME[S.role])}else render();toast(S.upcoming?'Showing upcoming features, marked “Soon”':'Showing only what’s in the product today');break}
  case 'togglemode':{const c=t.dataset.c;S.open[c]=!S.open[c];renderSide();break}
  case 'newchat':{const c=t.dataset.c;stopSpeaking();S.course=c;S.chats[c]=[];S.asked[c]=[];S.activeChat=null;S.open[c]=true;go('tutor',{voice:false});break}
  case 'openchat':case 'closeopen':{closeModal();const c=t.dataset.c,qa=t.dataset.qa,q=COURSES[c].qa[qa];stopSpeaking();S.course=c;S.open[c]=true;S.chats[c]=[{role:'user',text:q.q},{role:'ai',kind:'answer',text:q.a,src:q.src}];S.last[c]=qa;S.asked[c]=[qa];S.activeChat=c+':'+qa;go('tutor',{voice:false});break}
  case 'suggest':{const c=t.dataset.c,qa=t.dataset.qa;stopSpeaking();S.course=c;S.open[c]=true;S.chats[c]=[];S.asked[c]=[];S.activeChat=c+':'+qa;go('tutor',{voice:false,ask:COURSES[c].qa[qa].q});break}
  case 'voicemode':S.voiceMode=true;render();break;
  case 'markdone':S.markDone=!S.markDone;render();if(S.markDone)toast('Marked as done. Up next: Network appliances');break;
  case 'missed':missedModal();break;
  case 'closepractice':closeModal();go('practice');break;
  case 'streak':toast('5-day streak. Learn something today to keep it going.');break;
  case 'wsswitch':brandModal();break;
  case 'csw':S.course=t.dataset.c;render();break;
  case 'atab':S.aTab=t.dataset.t;render();break;
  case 'submitlog':S.logSent=true;render();toast('Sent to Dana Brooks for sign-off');break;
  case 'course':S.course=t.dataset.c;stopSpeaking();S.sideOpen=false;render();break;
  case 'menu':S.sideOpen=!S.sideOpen;renderSide();break;
  case 'goask':{const qa=t.dataset.qa;if(!qa){go('practice');break}S.view='tutor';S.voiceMode=false;S.sideOpen=false;try{history.replaceState(null,'','#tutor')}catch(err){}render();setTimeout(()=>ask(C().qa[qa].q),reduce?0:250);break}
  case 'talk':S.course='sec';go('tutor',{voice:true});setTimeout(listen,300);break;
  case 'chip':{const k=t.dataset.k;if(k==='deep'){toast('Deep Dive created from this conversation');go('practice');break}if(k.startsWith('q:'))ask(C().qa[k.slice(2)].q);else ask(null,k);break}
  case 'mic':listen();break;
  case 'voiceout':S.voiceOut=!S.voiceOut;persist();if(!S.voiceOut)stopSpeaking();t.classList.toggle('on',S.voiceOut);t.setAttribute('aria-pressed',S.voiceOut);t.title=S.voiceOut?'Stop reading answers aloud':'Read answers aloud';toast(S.voiceOut?`${S.tutor.name} will read answers aloud`:'Voice output off');break;
  case 'endsession':stopSpeaking();S.chats[S.course]=[];S.asked[S.course]=[];render();toast('Session ended. Your progress is saved.');break;
  case 'cq':{const m=S.chats[S.course][+t.dataset.m];m.ans[+t.dataset.q]=+t.dataset.o;redrawThread();break}
  case 'pick':S.practice[S.course].sel=+t.dataset.o;render();break;
  case 'checkq':{const p=S.practice[S.course],q=C().practice[p.i];
   if(q.type==='mc'){p.graded=true;p.res.push({topic:q.topic,pts:p.sel===q.c?1:0,max:1})}
   else{const txt=(document.getElementById('openans').value||'').toLowerCase();p.open=document.getElementById('openans').value;const hits=q.rub.map(r=>({p:r.p,ok:r.k.some(k=>txt.includes(k))}));const max=q.need||q.rub.length;const pts=Math.min(max,hits.filter(h=>h.ok).length);p.graded={hits,pts,max};p.res.push({topic:q.topic,pts,max})}
   render();break}
  case 'nextq':{const p=S.practice[S.course];p.i++;p.sel=null;p.graded=null;p.open='';render();break}
  case 'restartpractice':S.practice[S.course]=null;render();break;
  case 'reviewweak':{const c=C(),topic=t.dataset.t.toLowerCase();const id=matchQA(topic)||c.starters[0];go('tutor');setTimeout(()=>ask(c.qa[id].q),reduce?0:250);break}
  case 'copy':copyText(t.dataset.text,'Certificate ID copied');break;
  case 'learner':learnerModal(+t.dataset.i);break;
  case 'close':closeModal();break;
  case 'scrim':if(e.target===t)closeModal();break;
  case 'draftfor':closeModal();S.outputs[S.course]={id:'msg',text:C().copilot.msg,done:false};go('copilot');runGen();break;
  case 'copysummary':{const c=C(),co=c.cohort;copyText(`${c.title} · ${co.name}\nActive this week: ${co.kpi[0]}\nAvg. practice score: ${co.kpi[1]} (target 70%)\nTutor questions this week: ${co.kpi[2]}\nWeakest topic: ${co.weak} (${co.topics[0][1]}%, ${co.weakN} below target)\nNeed attention: ${LEARNERS.filter(l=>l.risk).map(l=>l.n+' ('+l.risk+')').join('; ')}`,'Cohort summary copied');break}
  case 'gen':S.outputs[S.course]={id:t.dataset.g,text:C().copilot[t.dataset.g],done:false};render();runGen();break;
  case 'copyout':{const o=S.outputs[S.course];if(o)copyText(o.text,'Copied');break}
  case 'useout':{const o=S.outputs[S.course];toast(o&&o.id==='msg'?'Message sent to Hannah Brooks (demo)':'Added to the Module 3 practice set (demo)');break}
  case 'strict':S.strict=!S.strict;t.classList.toggle('on',S.strict);t.setAttribute('aria-checked',S.strict);toast(S.strict?'Tutor answers only from course material':'Tutor may add general knowledge, marked as such');break;
  case 'pres':readTutorFields();S.tutor.pres=t.dataset.p;render();break;
  case 'previewvoice':{readTutorFields();const old=S.voiceOut;S.voiceOut=true;speak(`Hi, I’m ${S.tutor.name}. I’ll help you learn from your course material, and I’ll always show you where my answers come from.`);S.voiceOut=old;const pv=document.querySelector('.set-prev');if(pv){pv.classList.add('speaking');setTimeout(()=>pv.classList.remove('speaking'),5000)}break}
  case 'savetutor':readTutorFields();persist();render();toast('Tutor settings saved');break;
  case 'swatch':S.brand.color=t.dataset.c==='#6D28D9'?'':t.dataset.c;persist();render();brandModal();break;
  case 'resetbrand':S.brand=Object.assign({},DEF.brand);persist();render();brandModal();toast('Demo branding restored');break;
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeModal();
 if(e.key==='Enter'){const r=e.target.closest&&e.target.closest('tr[data-act="learner"]');if(r)learnerModal(+r.dataset.i)}
});
document.addEventListener('submit',e=>{
 if(e.target.id==='composer'){e.preventDefault();const inp=document.getElementById('q');const v=inp.value.trim();if(!v)return;inp.value='';stopSpeaking();ask(v)}
});
document.addEventListener('input',e=>{
 const id=e.target.id;
 if(id==='b-name'){S.brand.name=e.target.value||'Your Academy';S.brand.slug=slugify(S.brand.name);if(!S.brand._initTouched)S.brand.initial=(S.brand.name.trim()[0]||'A').toUpperCase();persist();renderSide();const bp=document.querySelector('.brand-prev');if(bp){bp.querySelector('b').textContent=S.brand.name;bp.querySelector('.muted').textContent=S.brand.slug;bp.querySelector('.logo').textContent=S.brand.initial}const bi=document.getElementById('b-init');if(bi&&!S.brand._initTouched)bi.value=S.brand.initial}
 if(id==='b-init'){S.brand._initTouched=true;S.brand.initial=e.target.value.toUpperCase();persist();renderSide();const l=document.querySelector('.brand-prev .logo');if(l)l.textContent=S.brand.initial}
 if(id==='b-color'){S.brand.color=e.target.value;persist();applyBrand();document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('on'))}
 if(id==='openans'){S.practice[S.course].open=e.target.value}
});
document.addEventListener('change',e=>{
 const a=e.target.dataset&&e.target.dataset.act;
 if(a==='upload'&&e.target.files.length){addUploads(e.target.files);e.target.value=''}
 if(a==='roster'&&e.target.files.length){toast(`${e.target.files[0].name}: learners imported and invited (demo)`);e.target.value=''}
});
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');if(ev==='drop'&&e.dataTransfer.files.length)addUploads(e.dataTransfer.files)}}));

function readTutorFields(){
 const n=document.getElementById('t-name'),v=document.getElementById('t-voice'),m=document.getElementById('t-min');
 if(n)S.tutor.name=(n.value.trim()||'Alex').slice(0,20);
 if(v)S.tutor.voice=+v.value;
 if(m)S.tutor.minutes=Math.max(5,Math.min(600,+m.value||45));
}
function runGen(){
 const o=S.outputs[S.course];if(!o)return;
 const el=document.getElementById('outtext');if(!el){o.done=true;return}
 el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});
 if(reduce){el.textContent=o.text;o.done=true;return}
 let n=0;const txt=o.text;clearInterval(runGen._t);
 runGen._t=setInterval(()=>{n+=9;el.textContent=txt.slice(0,n);if(n>=txt.length){clearInterval(runGen._t);o.done=true}},16);
}
function copyText(text,msg){
 const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg)}catch(e){toast('Select the text to copy it')}ta.remove()};
 try{navigator.clipboard.writeText(text).then(()=>toast(msg),fallback)}catch(e){fallback()}
}

/* ---------- Boot ---------- */
const side=document.getElementById('side'),top=document.getElementById('top'),main=document.getElementById('main'),footnote=document.getElementById('footnote');
const all=Object.values(ROUTES).flat();
const h=(location.hash||'').slice(1);
if(all.includes(h)){S.view=h;S.role=Object.keys(ROUTES).find(r=>ROUTES[r].includes(h));if(h==='tutor')S.voiceMode=true;if(isSoon())S.upcoming=true}
// Personalized links: ?academy=Summit+Tech+Academy&color=1D4ED8&letter=S (not saved)
try{const q=new URLSearchParams(location.search),an=(q.get('academy')||'').trim(),col=(q.get('color')||'').replace('#','');
 if(an){S.brand.name=an.slice(0,40);S.brand.slug=slugify(S.brand.name);S.brand.initial=((q.get('letter')||an[0])+'').slice(0,2).toUpperCase()}
 if(/^[0-9a-f]{6}$/i.test(col))S.brand.color='#'+col;
}catch(e){}
if('speechSynthesis' in window){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}}
render();
})();
