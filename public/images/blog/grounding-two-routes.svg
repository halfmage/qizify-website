<svg xmlns="http://www.w3.org/2000/svg" width="440" height="566" viewBox="0 0 440 566" role="img" aria-label="Diagram: the same learner question sent two ways. Route A goes straight to the model, which answers from general knowledge and produces a confident but invented answer. Route B searches your indexed material first, hands the matching passages to the model, and returns an answer that cites the source.">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a1a1aa"/></marker></defs>
  <rect x="0" y="0" width="440" height="566" rx="16" fill="#18181b"/>
  <text x="20" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="21" fill="#fafafa" font-weight="600">The same question, two routes</text>
  <text x="20" y="57" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#a1a1aa">Why grounding changes the answer</text>
  <rect x="20" y="76" width="400" height="88" rx="10" fill="#27272a" stroke="#cc7a3e" stroke-width="1.5"/>
  <text x="38" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#e8b07a">A learner asks</text>
  <text x="38" y="126" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15.5" fill="#fafafa">Which module covers the fire safety</text>
  <text x="38" y="148" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15.5" fill="#fafafa">rules for our warehouse sites?</text>
  <path d="M32,172 L32,350" stroke="#3f3f46" stroke-width="1.5"/>
  <path d="M32,210 L46,210" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M32,348 L46,348" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="52" y="182" width="368" height="122" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="70" y="210" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="17" fill="#fafafa" font-weight="600">Route A: straight to the model</text>
  <text x="70" y="236" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#d4d4d8">It answers from general knowledge</text>
  <rect x="70" y="250" width="332" height="38" rx="8" fill="#27272a" stroke="#a1a1aa" stroke-width="1"/>
  <text x="86" y="274" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a1a1aa">Confident, fluent, invented</text>
  <rect x="52" y="320" width="368" height="188" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="70" y="348" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="17" fill="#fafafa" font-weight="600">Route B: through your index first</text>
  <text x="70" y="376" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#d4d4d8">1   Search your indexed material</text>
  <text x="70" y="398" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#d4d4d8">2   Hand the matching passages over</text>
  <text x="70" y="420" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#d4d4d8">3   Answer from those, cite the source</text>
  <rect x="70" y="434" width="332" height="56" rx="8" fill="#27272a" stroke="#cc7a3e" stroke-width="1.5"/>
  <text x="86" y="458" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#e8b07a">According to module 4.2, section 3 ...</text>
  <text x="86" y="478" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a1a1aa">with a link the learner can check</text>
  <text x="20" y="534" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a1a1aa">One layer between your content and the model</text>
  <text x="20" y="554" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a1a1aa">is the whole difference.</text>
</svg>
