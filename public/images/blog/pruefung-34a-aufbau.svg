<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 661" role="img" aria-label="Structure of the German section 34a security exam: a written part of 82 multiple-choice tasks worth 120 points in 120 minutes with a pass mark of 60 and partial credit since 1 July 2025; then, only for those who pass, an oral part of around 15 minutes in groups of up to five. Both rest on seven subject areas fixed in law.">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a89e92"/></marker></defs>
  <rect x="0" y="0" width="520" height="661" rx="16" fill="#2a2622"/>
  <text x="24" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#faf8f4" font-weight="600">How the § 34a security exam is</text>
  <text x="24" y="63" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#faf8f4" font-weight="600">structured</text>
  <text x="24" y="87" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a89e92">As it stands since the changeover on 1 July 2025</text>
  <rect x="24" y="109" width="472" height="202" rx="10" fill="#37322c" stroke="#cc7a3e" stroke-width="2"/>
  <text x="44" y="135" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#e8b07a" font-weight="600" letter-spacing="0.05em">PART 1: WRITTEN</text>
  <text x="44" y="187" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="34" fill="#faf8f4" font-weight="600">82</text>
  <text x="98" y="187" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">multiple-choice tasks</text>
  <text x="44" y="227" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="34" fill="#faf8f4" font-weight="600">120</text>
  <text x="118" y="227" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">points in 120 minutes</text>
  <text x="44" y="267" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="34" fill="#e8b07a" font-weight="600">60</text>
  <text x="98" y="267" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">points to pass</text>
  <text x="44" y="301" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Partial credit for partially correct answers</text>
  <path d="M260,323 L260,339" stroke="#a89e92" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="260" y="359" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92" text-anchor="middle">only if passed</text>
  <rect x="24" y="371" width="472" height="182" rx="10" fill="#37322c" stroke="#46402f" stroke-width="1"/>
  <text x="44" y="397" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92" font-weight="600" letter-spacing="0.05em">PART 2: ORAL</text>
  <text x="44" y="449" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="34" fill="#faf8f4" font-weight="600">15</text>
  <text x="98" y="449" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">minutes, roughly</text>
  <text x="44" y="489" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="34" fill="#faf8f4" font-weight="600">5</text>
  <text x="78" y="489" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">candidates per group, at most</text>
  <text x="44" y="523" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Situational scenarios, and where a guard&#x27;s powers end</text>
  <text x="44" y="543" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">and the police&#x27;s begin</text>
  <rect x="24" y="565" width="472" height="60" rx="10" fill="#37322c" stroke="#46402f" stroke-width="1"/>
  <text x="40" y="591" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Behind both parts: seven subject areas fixed in law, each</text>
  <text x="40" y="611" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">with learning objectives and a taxonomy level</text>
</svg>
