<svg xmlns="http://www.w3.org/2000/svg" width="520" height="268" viewBox="0 0 520 268" role="img" aria-label="A thirty minute weekly routine that costs nothing: ten minutes checking one source for what changed, fifteen minutes redoing a real task from your own week with the tool so you can judge the output, and five minutes writing down what worked and what did not.">
  <rect x="0" y="0" width="520" height="268" rx="16" fill="#18181b"/>
  <text x="24" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#fafafa" font-weight="600">Thirty minutes a week</text>
  <text x="24" y="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a1a1aa">No budget, no approval, no course</text>
  <rect x="24" y="86" width="155" height="34" rx="8" fill="#71717a"/>
  <rect x="183" y="86" width="232" height="34" rx="8" fill="#e8b07a"/>
  <rect x="419" y="86" width="77" height="34" rx="8" fill="#27272a"/>
  <text x="24" y="146" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="17" fill="#fafafa" font-weight="600">10 min</text>
  <text x="183" y="146" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="17" fill="#e8b07a" font-weight="600">15 min</text>
  <text x="419" y="146" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="17" fill="#fafafa" font-weight="600">5 min</text>
  <text x="24" y="172" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#d4d4d8">What changed.</text>
  <text x="24" y="192" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#d4d4d8">One source,</text>
  <text x="24" y="212" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#d4d4d8">rotating.</text>
  <text x="183" y="172" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#d4d4d8">A real task from your week,</text>
  <text x="183" y="192" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#d4d4d8">done again with the tool.</text>
  <text x="183" y="212" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#d4d4d8">You already know what</text>
  <text x="183" y="232" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#d4d4d8">good looks like.</text>
  <text x="419" y="172" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#d4d4d8">Write it</text>
  <text x="419" y="192" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#d4d4d8">down.</text>
  <text x="24" y="258" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13.5" fill="#a1a1aa">The middle block is the one that teaches. The other two make it stick.</text>
</svg>
