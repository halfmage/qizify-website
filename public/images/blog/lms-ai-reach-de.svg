<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 538" role="img" aria-label="Diagramm: Jede in Moodle eingebaute KI-Aktion arbeitet auf der Seite, die der Lernende bereits offen hat. Text erzeugen, Bild erzeugen und Text zusammenfassen, dazu Text erklaeren ab Moodle 5.2. Keine durchsucht die Kursbibliothek, also kommt die Antwort aus dem Allgemeinwissen des Modells und nicht aus Ihrem Material.">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a89e92"/></marker></defs>
  <rect x="0" y="0" width="440" height="538" rx="16" fill="#2a2622"/>
  <text x="20" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="21" fill="#faf8f4" font-weight="600">Was die eingebaute KI erreicht</text>
  <text x="20" y="57" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#a89e92">Jede Aktion arbeitet in der offenen Seite</text>
  <rect x="20" y="76" width="400" height="92" rx="10" fill="#2a2622" stroke="#a89e92" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="38" y="104" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="17" fill="#faf8f4" font-weight="600">Ihre Kursbibliothek</text>
  <text x="38" y="128" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#cfc7be">Kurse, Handbücher, Altprüfungen, Notizen</text>
  <text x="38" y="150" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">Wird von der eingebauten KI nie durchsucht</text>
  <path d="M56,190 L384,190" stroke="#cc7a3e" stroke-width="1.5" stroke-dasharray="6 5"/>
  <circle cx="220" cy="190" r="15" fill="#2a2622" stroke="#cc7a3e" stroke-width="1.5"/>
  <path d="M214,184 L226,196 M226,184 L214,196" stroke="#e8b07a" stroke-width="1.6" stroke-linecap="round"/>
  <text x="220" y="224" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#e8b07a" text-anchor="middle">keine Verbindung</text>
  <rect x="20" y="240" width="400" height="146" rx="10" fill="#37322c" stroke="#46402f" stroke-width="1"/>
  <text x="38" y="268" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="17" fill="#faf8f4" font-weight="600">Die Seite, die der Lernende offen hat</text>
  <rect x="38" y="284" width="178" height="38" rx="8" fill="#3a3128" stroke="#46402f" stroke-width="1"/>
  <text x="127" y="308" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#cfc7be" text-anchor="middle">Text erzeugen</text>
  <rect x="224" y="284" width="178" height="38" rx="8" fill="#3a3128" stroke="#46402f" stroke-width="1"/>
  <text x="313" y="308" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#cfc7be" text-anchor="middle">Bild erzeugen</text>
  <rect x="38" y="330" width="178" height="38" rx="8" fill="#3a3128" stroke="#46402f" stroke-width="1"/>
  <text x="127" y="354" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#cfc7be" text-anchor="middle">Text zusammenfassen</text>
  <rect x="224" y="330" width="178" height="38" rx="8" fill="#3a3128" stroke="#46402f" stroke-width="1"/>
  <text x="313" y="354" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#cfc7be" text-anchor="middle">Text erklären (5.2)</text>
  <path d="M220,388 L220,400" stroke="#a89e92" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="20" y="406" width="400" height="76" rx="10" fill="#3a3128" stroke="#cc7a3e" stroke-width="2"/>
  <text x="38" y="434" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15.5" fill="#cfc7be">Die Antwort kommt aus dem Allgemeinwissen</text>
  <text x="38" y="456" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15.5" fill="#cfc7be">des Modells, nicht aus Ihrem Material.</text>
  <text x="20" y="508" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">Die Frage des Lernenden liegt in der Bibliothek.</text>
  <text x="20" y="528" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">Die Aktionen gehen nie dorthin.</text>
</svg>
