<svg xmlns="http://www.w3.org/2000/svg" width="520" height="381" viewBox="0 0 520 381" role="img" aria-label="Bar chart: an apprentice costs a German employer about 26,200 euros gross per year on average, about 8,100 euros net after the value of their work. Recruiting a skilled worker externally costs about 13,700 euros. Source: BIBB cost-benefit survey 2022/23.">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a1a1aa"/></marker></defs>
  <rect x="0" y="0" width="520" height="381" rx="16" fill="#18181b"/>
  <text x="24" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#fafafa" font-weight="600">What training costs, and what the</text>
  <text x="24" y="63" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#fafafa" font-weight="600">alternative costs</text>
  <text x="24" y="87" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a1a1aa">Average per person, all trades, Germany, training year 2022/23</text>
  <text x="24" y="121" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#d4d4d8">Apprentice, gross cost per year</text>
  <rect x="24" y="129" width="388.0" height="24" rx="4" fill="#71717a"/>
  <text x="422.0" y="147" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#fafafa" font-weight="600">€26,200</text>
  <text x="24" y="183" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#d4d4d8">Apprentice, net cost per year (after their work)</text>
  <rect x="24" y="191" width="120.0" height="24" rx="4" fill="#71717a"/>
  <text x="153.95419847328245" y="209" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#fafafa" font-weight="600">€8,100</text>
  <text x="24" y="245" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#e8b07a" font-weight="600">Recruiting a skilled worker externally, one-off</text>
  <rect x="24" y="253" width="202.9" height="24" rx="4" fill="#cc7a3e"/>
  <text x="236.8854961832061" y="271" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#e8b07a" font-weight="600">€13,700</text>
  <text x="24" y="321" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a1a1aa">Source: BIBB cost-benefit survey 2022/23 (press release, 31 Jul</text>
  <text x="24" y="339" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a1a1aa">2025). Compared with earlier surveys, recruiting costs rose 65%,</text>
  <text x="24" y="357" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a1a1aa">net training costs 28%.</text>
</svg>
