<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 584" role="img" aria-label="Diagram: two layers turn an open base model into AI that is yours. Retrieval (RAG) answers from your own content and changes what the model knows. Fine-tuning (LoRA) takes on your style, formats and tasks and changes how it behaves. Both sit on one shared open base model.">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a89e92"/></marker></defs>
  <rect x="0" y="0" width="520" height="584" rx="16" fill="#2a2622"/>
  <text x="24" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#faf8f4" font-weight="600">How a generic model becomes your AI</text>
  <text x="24" y="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a89e92">Two layers turn an open base model into AI that is yours</text>
  <rect x="24" y="80" width="472" height="60" rx="10" fill="#37322c" stroke="#46402f" stroke-width="1"/>
  <text x="40" y="106" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Input: your content and documents, your tone, your</text>
  <text x="40" y="126" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">formats and tasks</text>
  <path d="M260,152 L260,168" stroke="#a89e92" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="24" y="178" width="472" height="108" rx="10" fill="#37322c" stroke="#cc7a3e" stroke-width="2"/>
  <text x="44" y="204" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#e8b07a" font-weight="600" letter-spacing="0.05em">RETRIEVAL (RAG)</text>
  <text x="44" y="250" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Answers from your own content</text>
  <text x="44" y="276" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Changes what the model knows</text>
  <rect x="24" y="298" width="472" height="108" rx="10" fill="#37322c" stroke="#46402f" stroke-width="1"/>
  <text x="44" y="324" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92" font-weight="600" letter-spacing="0.05em">FINE-TUNING (LORA)</text>
  <text x="44" y="370" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Your style, your formats and tasks</text>
  <text x="44" y="396" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Changes how the model behaves</text>
  <path d="M260,418 L260,434" stroke="#a89e92" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="24" y="444" width="472" height="60" rx="10" fill="#37322c" stroke="#cc7a3e" stroke-width="2"/>
  <text x="40" y="470" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Both sit on one shared open base model and add up to your</text>
  <text x="40" y="490" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">own custom AI</text>
  <text x="24" y="542" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">One shared base, a per-client LoRA adapter and a per-client RAG</text>
  <text x="24" y="560" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">index: personalized AI, with each client&#x27;s data kept separate.</text>
</svg>
