<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 519" role="img" aria-label="Tabelle zum Aufbau der Sachkundeprüfung nach § 34a GewO, Teil 1 schriftlich gegen Teil 2 mündlich: 82 Multiple-Choice-Aufgaben gegenüber Situationsaufgaben in Gruppen von bis zu fünf Personen; 120 Minuten gegenüber etwa 15 Minuten; bestanden ab 60 von 120 Punkten mit Teilpunkten seit dem 1. Juli 2025, während zum mündlichen Teil nur zugelassen wird, wer den schriftlichen bestanden hat. Grundlage sind sieben Sachgebiete nach § 7 BewachV.">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a89e92"/></marker></defs>
  <rect x="0" y="0" width="520" height="519" rx="16" fill="#2a2622"/>
  <text x="24" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#faf8f4" font-weight="600">Wie die Sachkundeprüfung § 34a GewO</text>
  <text x="24" y="63" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#faf8f4" font-weight="600">aufgebaut ist</text>
  <text x="24" y="87" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a89e92">Stand seit der Umstellung zum 1. Juli 2025</text>
  <text x="132" y="121" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#a89e92" font-weight="600" letter-spacing="0.08em">TEIL 1: SCHRIFTLICH</text>
  <text x="320" y="121" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#a89e92" font-weight="600" letter-spacing="0.08em">TEIL 2: MÜNDLICH</text>
  <path d="M24,131 L496,131" stroke="#46402f" stroke-width="1"/>
  <text x="24" y="157" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4" font-weight="600">Format</text>
  <text x="132" y="157" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">82 Aufgaben, Multiple</text>
  <text x="132" y="177" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Choice</text>
  <text x="320" y="157" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Situationsaufgaben in</text>
  <text x="320" y="177" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Gruppen von bis zu fünf</text>
  <text x="320" y="197" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Personen</text>
  <path d="M24,213 L496,213" stroke="#46402f" stroke-width="1"/>
  <text x="24" y="239" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4" font-weight="600">Dauer</text>
  <text x="132" y="239" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">120 Minuten</text>
  <text x="320" y="239" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">etwa 15 Minuten</text>
  <path d="M24,255 L496,255" stroke="#46402f" stroke-width="1"/>
  <text x="24" y="281" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4" font-weight="600">Bestehen</text>
  <text x="132" y="281" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">60 von 120 Punkten,</text>
  <text x="132" y="301" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Teilpunkte seit 1. Juli</text>
  <text x="132" y="321" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">2025</text>
  <text x="320" y="281" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Zulassung nur mit</text>
  <text x="320" y="301" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">bestandenem Teil 1</text>
  <path d="M24,337 L496,337" stroke="#46402f" stroke-width="1"/>
  <rect x="24" y="351" width="472" height="88" rx="10" fill="#37322c" stroke="#46402f" stroke-width="1"/>
  <text x="40" y="377" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Grundlage für beide Teile: sieben Sachgebiete nach § 7</text>
  <text x="40" y="397" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">BewachV, je Lernziel mit Taxonomiestufe im</text>
  <text x="40" y="417" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Rahmenstoffplan</text>
  <text x="24" y="477" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">Die beiden Teile laufen nacheinander: zum mündlichen Teil wird nur</text>
  <text x="24" y="495" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">zugelassen, wer den schriftlichen bestanden hat.</text>
</svg>
