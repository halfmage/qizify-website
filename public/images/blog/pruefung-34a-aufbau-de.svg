<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 661" role="img" aria-label="Aufbau der Sachkundeprüfung nach § 34a GewO: schriftlicher Teil mit 82 Multiple-Choice-Aufgaben, 120 Punkten in 120 Minuten und 60 Punkten zum Bestehen, mit Teilpunkten seit dem 1. Juli 2025; danach, nur bei bestandenem schriftlichen Teil, der mündliche Teil mit rund 15 Minuten in Gruppen von bis zu fünf Personen. Grundlage sind sieben Sachgebiete nach § 7 BewachV.">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a89e92"/></marker></defs>
  <rect x="0" y="0" width="520" height="661" rx="16" fill="#2a2622"/>
  <text x="24" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#faf8f4" font-weight="600">Wie die Sachkundeprüfung § 34a GewO</text>
  <text x="24" y="63" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#faf8f4" font-weight="600">aufgebaut ist</text>
  <text x="24" y="87" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a89e92">Stand seit der Umstellung zum 1. Juli 2025</text>
  <rect x="24" y="109" width="472" height="202" rx="10" fill="#37322c" stroke="#cc7a3e" stroke-width="2"/>
  <text x="44" y="135" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#e8b07a" font-weight="600" letter-spacing="0.05em">TEIL 1: SCHRIFTLICH</text>
  <text x="44" y="187" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="34" fill="#faf8f4" font-weight="600">82</text>
  <text x="98" y="187" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Multiple-Choice-Aufgaben</text>
  <text x="44" y="227" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="34" fill="#faf8f4" font-weight="600">120</text>
  <text x="118" y="227" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Punkte in 120 Minuten</text>
  <text x="44" y="267" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="34" fill="#e8b07a" font-weight="600">60</text>
  <text x="98" y="267" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Punkte zum Bestehen</text>
  <text x="44" y="301" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Teilpunkte für teilweise richtige Antworten</text>
  <path d="M260,323 L260,339" stroke="#a89e92" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="260" y="359" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92" text-anchor="middle">nur wenn bestanden</text>
  <rect x="24" y="371" width="472" height="162" rx="10" fill="#37322c" stroke="#46402f" stroke-width="1"/>
  <text x="44" y="397" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92" font-weight="600" letter-spacing="0.05em">TEIL 2: MÜNDLICH</text>
  <text x="44" y="449" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="34" fill="#faf8f4" font-weight="600">15</text>
  <text x="98" y="449" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Minuten, ungefähr</text>
  <text x="44" y="489" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="34" fill="#faf8f4" font-weight="600">5</text>
  <text x="78" y="489" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Personen pro Gruppe, maximal</text>
  <text x="44" y="523" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Situationsaufgaben und Abgrenzung gegenüber der Polizei</text>
  <rect x="24" y="545" width="472" height="80" rx="10" fill="#37322c" stroke="#46402f" stroke-width="1"/>
  <text x="40" y="571" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Grundlage für beide Teile: sieben Sachgebiete nach § 7</text>
  <text x="40" y="591" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">BewachV, je Lernziel mit Taxonomiestufe im</text>
  <text x="40" y="611" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Rahmenstoffplan</text>
</svg>
