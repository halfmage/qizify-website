  <text x="50" y="452" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#a89e92">Meta &#183; US</text>
  <rect x="330" y="424" width="150" height="26" rx="13" fill="#cc7a3e" fill-opacity="0.16" stroke="#cc7a3e" stroke-opacity="0.55"/>
  <text x="405" y="441" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#cfc7be">Community licence</text>
  <text x="600" y="441" font-family="'Inter', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#d98a4a">&#9888; Restricted for EU firms</text>

  <line x1="40" y1="462" x2="800" y2="462" stroke="#46402f" stroke-width="1"/>
  <text x="40" y="480" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#8a8178">Permissive licences (Apache 2.0, MIT) allow free commercial self-hosting. Verify terms per model version.</text>
</svg>
