  <rect x="330" y="324" width="150" height="26" rx="13" fill="#7c5cfc" fill-opacity="0.16" stroke="#7c5cfc" stroke-opacity="0.55"/>
  <text x="405" y="341" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#cfc7be">Apache 2.0</text>
  <text x="600" y="341" font-family="'Inter', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#9a80ff">&#10003; EU-hostable</text>

