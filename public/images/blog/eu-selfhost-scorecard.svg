<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 486" role="img" aria-label="Scorecard: which open models can you self-host in the EU. Kimi (Moonshot, China), Modified MIT, EU-hostable. DeepSeek (China), MIT, EU-hostable. Qwen (Alibaba, China), Apache 2.0, EU-hostable. Mistral (France, EU), Apache 2.0, EU-hostable. gpt-oss (OpenAI, US), Apache 2.0, EU-hostable. Gemma (Google, US), Gemma licence, EU-hostable. Llama (Meta, US), community licence, restricted for EU-domiciled firms.">
  <rect x="0" y="0" width="840" height="486" rx="16" fill="#2a2622"/>
  <text x="40" y="42" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#faf8f4">Which open models can you self-host in the EU?</text>
  <text x="40" y="66" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#a89e92">Licence and EU commercial use for the models in this guide</text>

  <!-- column headers -->
  <text x="50" y="100" font-family="'Inter', system-ui, sans-serif" font-size="11" letter-spacing="0.06em" fill="#8a8178">MODEL</text>
  <text x="330" y="100" font-family="'Inter', system-ui, sans-serif" font-size="11" letter-spacing="0.06em" fill="#8a8178">LICENCE</text>
  <text x="600" y="100" font-family="'Inter', system-ui, sans-serif" font-size="11" letter-spacing="0.06em" fill="#8a8178">EU COMMERCIAL SELF-HOST</text>

