<svg xmlns="http://www.w3.org/2000/svg" width="520" height="346" viewBox="0 0 520 346" role="img" aria-label="Balkendiagramm der Bestehensquoten bei IHK-Prüfungen 2024: von 54.405 Teilnehmenden an Fortbildungsprüfungen bestanden 70,9 Prozent, bei der Geprüften Schutz- und Sicherheitskraft 63,5 Prozent. Quelle: DIHK, IHK-Fortbildungsstatistik bundesweit, Berichtsjahr 2024.">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a1a1aa"/></marker></defs>
