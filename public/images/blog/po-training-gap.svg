<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 262" role="img" aria-label="Access is not the constraint. 83 percent of agile practitioners use AI tools, while only 15 percent have had any formal training on using it in an agile context. Source: AI4Agile Practitioners Report 2026, 289 practitioners across more than 20 countries.">
  <rect x="0" y="0" width="520" height="262" rx="16" fill="#2a2622"/>
  <text x="24" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#faf8f4" font-weight="600">Everyone has it. Almost nobody was taught</text>
  <text x="24" y="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a89e92">Agile practitioners, 2026</text>
  <text x="24" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Use AI tools</text>
  <rect x="24" y="112" width="400" height="28" rx="6" fill="#37322c"/>
  <rect x="24" y="112" width="332" height="28" rx="6" fill="#786d60"/>
  <text x="436" y="132" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="17" fill="#faf8f4" font-weight="600">83%</text>
  <text x="24" y="178" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Had any training in using it</text>
  <rect x="24" y="190" width="400" height="28" rx="6" fill="#37322c"/>
  <rect x="24" y="190" width="60" height="28" rx="6" fill="#e8b07a"/>
  <text x="436" y="210" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="17" fill="#faf8f4" font-weight="600">15%</text>
  <text x="24" y="248" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cc7a3e" font-weight="600">67% of their organisations already provide the tools.</text>
</svg>
