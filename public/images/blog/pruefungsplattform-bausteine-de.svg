<svg xmlns="http://www.w3.org/2000/svg" width="520" height="783" viewBox="0 0 520 783" role="img" aria-label="Diagramm: die fünf Bausteine einer eigenen Prüfungsplattform, vom Rahmenstoffplan über Curriculum-Mapping, Fragenpool mit Taxonomiestufen, adaptive Wiederholung und Prüfungssimulation bis zum KI-Lernbegleiter auf Ihren eigenen Inhalten.">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a1a1aa"/></marker></defs>
  <rect x="0" y="0" width="520" height="783" rx="16" fill="#18181b"/>
  <text x="24" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#fafafa" font-weight="600">Vom Rahmenstoffplan zur bestandenen</text>
  <text x="24" y="63" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#fafafa" font-weight="600">Prüfung</text>
  <text x="24" y="87" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a1a1aa">Die fünf Bausteine einer eigenen Prüfungsplattform</text>
  <rect x="24" y="109" width="472" height="68" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="40" y="135" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#d4d4d8">Eingang: Rahmenstoffplan der IHK (7 Sachgebiete) und Ihre</text>
  <text x="40" y="155" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#d4d4d8">eigenen Kursunterlagen</text>
  <path d="M260,189 L260,205" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M52,245 L52,645" stroke="#71717a" stroke-width="2.5"/>
  <rect x="24" y="215" width="472" height="90" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="52" cy="245" r="16" fill="#3f3f46"/>
  <text x="52" y="251" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" fill="#e8b07a" font-weight="600" text-anchor="middle">1</text>
  <text x="80" y="242" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" fill="#fafafa" font-weight="600">Curriculum-Mapping</text>
  <text x="80" y="264" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#a1a1aa">Sachgebiete und Lernziele des Rahmenstoffplans</text>
  <text x="80" y="283" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#a1a1aa">werden zur Struktur der Plattform</text>
  <rect x="24" y="315" width="472" height="90" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="52" cy="345" r="16" fill="#3f3f46"/>
  <text x="52" y="351" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" fill="#e8b07a" font-weight="600" text-anchor="middle">2</text>
  <text x="80" y="342" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" fill="#fafafa" font-weight="600">Fragenpool mit Taxonomiestufen</text>
  <text x="80" y="364" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#a1a1aa">Jede Frage hängt an einem Lernziel und an der</text>
  <text x="80" y="383" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#a1a1aa">geforderten Anforderungstiefe</text>
  <rect x="24" y="415" width="472" height="90" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="52" cy="445" r="16" fill="#3f3f46"/>
  <text x="52" y="451" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" fill="#e8b07a" font-weight="600" text-anchor="middle">3</text>
  <text x="80" y="442" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" fill="#fafafa" font-weight="600">Adaptive Wiederholung</text>
  <text x="80" y="464" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#a1a1aa">Der Lernpfad priorisiert die Sachgebiete, in denen die</text>
  <text x="80" y="483" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#a1a1aa">Person noch schwach ist</text>
  <rect x="24" y="515" width="472" height="90" rx="10" fill="#27272a" stroke="#cc7a3e" stroke-width="2"/>
  <circle cx="52" cy="545" r="16" fill="#3f3f46"/>
  <text x="52" y="551" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" fill="#e8b07a" font-weight="600" text-anchor="middle">4</text>
  <text x="80" y="542" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" fill="#fafafa" font-weight="600">Prüfungssimulation im Originalformat</text>
  <text x="80" y="564" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#a1a1aa">Gleiche Aufgabenzahl, gleiche Punktlogik, gleiche Zeit</text>
  <text x="80" y="583" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#a1a1aa">wie in der echten Prüfung</text>
  <rect x="24" y="615" width="472" height="90" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="52" cy="645" r="16" fill="#3f3f46"/>
  <text x="52" y="651" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" fill="#e8b07a" font-weight="600" text-anchor="middle">5</text>
  <text x="80" y="642" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" fill="#fafafa" font-weight="600">KI-Lernbegleiter auf Ihren Inhalten</text>
  <text x="80" y="664" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#a1a1aa">Erklärt Fehler mit Ihrem Kursmaterial, nicht mit Wissen</text>
  <text x="80" y="683" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#a1a1aa">aus dem offenen Internet</text>
  <text x="24" y="741" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a1a1aa">Ergebnis: belastbare Bestehensprognose je Teilnehmer und</text>
  <text x="24" y="759" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a1a1aa">prüfsichere Nachweise für AZAV und Bildungsgutschein</text>
</svg>
