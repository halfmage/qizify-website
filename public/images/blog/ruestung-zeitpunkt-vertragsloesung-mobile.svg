<rect x="223.5" y="202" width="68.2" height="28" rx="4" fill="#71717a"/>
<text x="258.6" y="221" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#fafafa" font-weight="600" text-anchor="middle">23.1%</text>
