<svg xmlns="http://www.w3.org/2000/svg" width="340" height="404" viewBox="0 0 340 404" role="img" aria-label="Stacked bars: when apprenticeship contracts terminated early in 2024 ended. Industry and commerce: 36.5 percent during probation, 33.9 percent later in the first year, 22.3 in the second year, 7.3 later. All trades: 34.7, 32.9, 23.1 and 9.3 percent. Source: BIBB Datenreport 2026, table A5.6-1.">
