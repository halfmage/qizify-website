<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 731" role="img" aria-label="Comparison of what happens to your own course material: in a standard LMS the script, slides and questions become a PDF, a video and a one-off quiz, and the learner reads; in a platform you own they become tagged questions, a syllabus path, adaptive repetition and a mock exam, and the learner is questioned and corrected.">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a89e92"/></marker></defs>
  <rect x="0" y="0" width="520" height="731" rx="16" fill="#2a2622"/>
  <text x="24" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#faf8f4" font-weight="600">The same content, two very different</text>
  <text x="24" y="63" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#faf8f4" font-weight="600">outcomes</text>
  <text x="24" y="87" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a89e92">What happens to your material, depending on what you put it</text>
  <text x="24" y="107" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a89e92">into</text>
  <rect x="24" y="129" width="472" height="60" rx="10" fill="#37322c" stroke="#46402f" stroke-width="1"/>
  <text x="40" y="155" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">The same starting point either way: your scripts, slides,</text>
  <text x="40" y="175" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">handouts and practice questions</text>
  <path d="M260,201 L260,217" stroke="#a89e92" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="24" y="227" width="472" height="206" rx="10" fill="#37322c" stroke="#46402f" stroke-width="1"/>
  <text x="44" y="253" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92" font-weight="600" letter-spacing="0.05em">STANDARD LMS OR AUTHORING TOOL</text>
  <text x="44" y="299" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Script becomes a PDF to download</text>
  <text x="44" y="325" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Slides become a video</text>
  <text x="44" y="351" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Questions become a one-off quiz</text>
  <text x="44" y="377" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Progress becomes a tick</text>
  <rect x="44" y="391" width="432" height="32" rx="8" fill="#2a2622"/>
  <text x="58" y="412" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#a89e92" font-style="italic">Result: the learner reads.</text>
  <rect x="24" y="445" width="472" height="206" rx="10" fill="#37322c" stroke="#cc7a3e" stroke-width="2"/>
  <text x="44" y="471" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#e8b07a" font-weight="600" letter-spacing="0.05em">A PLATFORM YOU OWN</text>
  <text x="44" y="517" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Questions carry an objective and a difficulty level</text>
  <text x="44" y="543" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">A path that follows the syllabus</text>
  <text x="44" y="569" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Repetition of what has not stuck</text>
  <text x="44" y="595" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">A mock exam in the real format</text>
  <rect x="44" y="609" width="432" height="32" rx="8" fill="#46402f"/>
  <text x="58" y="630" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#e8b07a" font-style="italic">Result: the learner is questioned.</text>
  <text x="24" y="689" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">The material stays yours either way. The difference is whether</text>
  <text x="24" y="707" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">it is stored or used.</text>
</svg>
