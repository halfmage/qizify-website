<svg xmlns="http://www.w3.org/2000/svg" width="340" height="476" viewBox="0 0 340 476" role="img" aria-label="Balkendiagramm: Beim Üben mit KI schnitten Schüler mit normalem ChatGPT-Zugang 48 Prozent besser ab als die Vergleichsgruppe, mit der Tutor-Version 127 Prozent besser. In der Prüfung ohne KI schnitt die ChatGPT-Gruppe 17 Prozent schlechter ab, die Tutor-Gruppe ohne messbaren Unterschied. Quelle: Bastani et al., PNAS 2025.">
<rect x="0" y="0" width="340" height="476" rx="14" fill="#18181b"/>
<text x="18" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="19" fill="#fafafa" font-weight="600">KI beim Üben, und dann</text>
