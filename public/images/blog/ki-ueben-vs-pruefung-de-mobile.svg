<text x="18" y="82" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" fill="#a1a1aa">Veränderung gegenüber der Vergleichs-</text>
<text x="18" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" fill="#a1a1aa">gruppe ohne KI, rund 1.000 Schüler</text>
<line x1="70" y1="386" x2="70" y2="414" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="70" y1="328" x2="70" y2="356" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="70" y1="230" x2="70" y2="258" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="70" y1="172" x2="70" y2="200" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="3 3"/>
<text x="18" y="140" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#fafafa" font-weight="600">Beim Üben, mit KI</text>
<text x="18" y="168" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" fill="#d4d4d8">Normaler ChatGPT-Zugang</text>
<rect x="70" y="176" width="76.8" height="20" rx="4" fill="#71717a"/>
<text x="154.8" y="189" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" fill="#fafafa" font-weight="600">+48 %</text>
<text x="18" y="226" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" fill="#e8b07a" font-weight="600">Tutor-Version (nur Hinweise)</text>
<rect x="70" y="234" width="203.2" height="20" rx="4" fill="#cc7a3e"/>
<text x="281.20000000000005" y="247" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" fill="#e8b07a" font-weight="600">+127 %</text>
<text x="18" y="296" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#fafafa" font-weight="600">In der Prüfung, ohne KI</text>
<text x="18" y="324" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" fill="#d4d4d8">Normaler ChatGPT-Zugang</text>
<rect x="42.8" y="332" width="27.2" height="20" rx="4" fill="#71717a"/>
<text x="78" y="345" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" fill="#fafafa" font-weight="600">−17 %</text>
<text x="18" y="382" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" fill="#e8b07a" font-weight="600">Tutor-Version (nur Hinweise)</text>
<rect x="68" y="390" width="4" height="20" rx="2" fill="#cc7a3e"/>
<text x="80" y="403" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" fill="#e8b07a" font-weight="600">≈ 0, kein Unterschied</text>
<text x="18" y="452" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" fill="#a1a1aa">Quelle: Bastani et al., PNAS 2025</text>
