  <text x="620" y="314" font-family="'Inter', system-ui, sans-serif" font-size="11.5" fill="#a89e92">&#8364; / Monat</text>

  <text x="40" y="372" font-family="'Inter', system-ui, sans-serif" font-size="11.5" fill="#8a8178">EU-Anbieter: Hetzner, OVHcloud, Scaleway, IONOS. Preise Richtwerte, Stand 2026.</text>
