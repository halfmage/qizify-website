  <text x="330" y="118" font-family="'Inter', system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#faf8f4">Eine Mittelklasse-GPU</text>
  <text x="330" y="138" font-family="'Inter', system-ui, sans-serif" font-size="11.5" fill="#a89e92">eine 24-GB-Karte</text>
  <text x="620" y="118" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#faf8f4">niedrige Hunderte</text>
  <text x="620" y="138" font-family="'Inter', system-ui, sans-serif" font-size="11.5" fill="#a89e92">&#8364; / Monat</text>

  <rect x="40" y="174" width="760" height="76" rx="12" fill="#37322c" stroke="#46402f"/>
  <rect x="40" y="174" width="7" height="76" rx="3.5" fill="#8a6cff"/>
  <text x="72" y="210" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#faf8f4">120B</text>
  <text x="72" y="230" font-family="'Inter', system-ui, sans-serif" font-size="11.5" fill="#a89e92">z. B. gpt-oss</text>
  <text x="330" y="206" font-family="'Inter', system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#faf8f4">Eine 80-96-GB-GPU</text>
  <text x="330" y="226" font-family="'Inter', system-ui, sans-serif" font-size="11.5" fill="#a89e92">ein einzelner Server</text>
  <text x="620" y="206" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#faf8f4">ab ~900</text>
  <text x="620" y="226" font-family="'Inter', system-ui, sans-serif" font-size="11.5" fill="#a89e92">&#8364; / Monat</text>

  <rect x="40" y="262" width="760" height="76" rx="12" fill="#37322c" stroke="#46402f"/>
  <rect x="40" y="262" width="7" height="76" rx="3.5" fill="#6a4ae0"/>
  <text x="72" y="298" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#faf8f4">200B+</text>
  <text x="72" y="318" font-family="'Inter', system-ui, sans-serif" font-size="11.5" fill="#a89e92">größte offene Modelle</text>
  <text x="330" y="294" font-family="'Inter', system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#faf8f4">Multi-GPU-Knoten</text>
  <text x="330" y="314" font-family="'Inter', system-ui, sans-serif" font-size="11.5" fill="#a89e92">8 oder mehr GPUs</text>
