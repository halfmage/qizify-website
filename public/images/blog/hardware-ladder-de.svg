<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 392" role="img" aria-label="Worauf offene Modelle laufen. Ein quantisiertes Modell mit 20 bis 30 Milliarden Parametern läuft auf einer Mittelklasse-GPU mit 24 GB für niedrige Hunderte Euro pro Monat. Ein Modell mit 120 Milliarden Parametern wie gpt-oss läuft auf einer einzelnen 80- bis 96-GB-GPU ab etwa 900 Euro pro Monat. Die größten offenen Modelle ab 200 Milliarden Parametern brauchen einen Multi-GPU-Knoten für vierstellige Beträge pro Monat.">
  <rect x="0" y="0" width="840" height="392" rx="16" fill="#2a2622"/>
  <text x="40" y="42" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" font-weight="600" fill="#faf8f4">Worauf es läuft</text>
  <text x="40" y="66" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#a89e92">Offene Modelle wurden effizient: größere Modelle, weiterhin moderate Hardware</text>

  <rect x="40" y="86" width="760" height="76" rx="12" fill="#37322c" stroke="#46402f"/>
  <rect x="40" y="86" width="7" height="76" rx="3.5" fill="#a996ff"/>
  <text x="72" y="122" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#faf8f4">20-30B</text>
