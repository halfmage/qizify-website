<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 478" role="img" aria-label="Übersicht der Hardware-Stufen für offene Modelle: 20 bis 30 Milliarden Parameter quantisiert laufen auf einer Mittelklasse-GPU mit 24 GB für niedrige dreistellige Eurobeträge pro Monat; 120 Milliarden auf einer 80- bis 96-GB-GPU ab rund 900 Euro; 200 Milliarden und mehr auf einem Multi-GPU-Knoten im vierstelligen Bereich.">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a89e92"/></marker></defs>
  <rect x="0" y="0" width="520" height="478" rx="16" fill="#2a2622"/>
  <text x="24" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#faf8f4" font-weight="600">Worauf es läuft</text>
  <text x="24" y="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a89e92">Offene Modelle wurden effizient: größere Modelle, weiterhin</text>
  <text x="24" y="78" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a89e92">moderate Hardware</text>
  <rect x="300" y="96" width="196" height="286" rx="12" fill="#3a3128"/>
  <text x="24" y="112" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#a89e92" font-weight="600" letter-spacing="0.08em">GRÖSSE</text>
  <text x="132" y="112" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#a89e92" font-weight="600" letter-spacing="0.08em">LÄUFT AUF</text>
  <text x="312" y="112" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#e8b07a" font-weight="600" letter-spacing="0.08em">PRO MONAT</text>
  <path d="M24,122 L496,122" stroke="#46402f" stroke-width="1"/>
  <text x="24" y="148" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4" font-weight="600">20-30B</text>
  <text x="132" y="148" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Eine Mittelklasse-GPU,</text>
  <text x="132" y="168" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">eine einzelne</text>
  <text x="132" y="188" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">24-GB-Karte</text>
  <text x="312" y="148" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4">Niedrige Hunderte</text>
  <text x="312" y="168" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4">Euro</text>
  <rect x="24" y="162" width="11.5" height="4" rx="2" fill="#786d60"/>
  <path d="M24,214 L496,214" stroke="#46402f" stroke-width="1"/>
  <text x="24" y="240" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4" font-weight="600">120B</text>
  <text x="132" y="240" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Eine 80- bis</text>
  <text x="132" y="260" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">96-GB-GPU, ein</text>
  <text x="132" y="280" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">einzelner Server</text>
  <text x="312" y="240" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4">Ab rund 900 Euro</text>
  <rect x="24" y="254" width="46.1" height="4" rx="2" fill="#786d60"/>
  <path d="M24,306 L496,306" stroke="#46402f" stroke-width="1"/>
  <text x="24" y="332" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4" font-weight="600">200B und</text>
  <text x="24" y="352" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4" font-weight="600">mehr</text>
  <text x="132" y="332" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Multi-GPU-Knoten,</text>
  <text x="132" y="352" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">acht oder mehr GPUs</text>
  <text x="312" y="332" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4">Vierstellig</text>
  <rect x="24" y="366" width="96.0" height="4" rx="2" fill="#cc7a3e"/>
  <path d="M24,378 L496,378" stroke="#46402f" stroke-width="1"/>
  <text x="24" y="418" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">Der Balken zeigt die Modellgröße im Verhältnis. EU-Anbieter:</text>
  <text x="24" y="436" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">Hetzner, OVHcloud, Scaleway, IONOS. Preise sind Richtwerte, Stand</text>
  <text x="24" y="454" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">2026.</text>
</svg>
