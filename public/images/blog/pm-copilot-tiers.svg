<svg xmlns="http://www.w3.org/2000/svg" width="520" height="348" viewBox="0 0 520 348" role="img" aria-label="What each Copilot tier can reach. Copilot Chat Basic reaches web data only. Microsoft 365 Copilot Basic reaches web data and works inside Word, Excel, PowerPoint and OneNote. Microsoft 365 Copilot Premium, the paid add-on, additionally reaches your own files and mail automatically through Microsoft Graph, limited to files you already have permission to open.">
  <rect x="0" y="0" width="520" height="348" rx="16" fill="#18181b"/>
  <text x="24" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#fafafa" font-weight="600">What each Copilot can reach</text>
  <text x="24" y="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a1a1aa">Same name, three different products</text>
  <text x="236" y="98" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#a1a1aa" font-weight="600" letter-spacing="0.06em">WEB</text>
  <text x="324" y="98" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#a1a1aa" font-weight="600" letter-spacing="0.06em">IN APPS</text>
  <text x="412" y="98" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#a1a1aa" font-weight="600" letter-spacing="0.06em">YOUR FILES</text>
