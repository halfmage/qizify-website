  <text x="24" y="138" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#fafafa" font-weight="600">Copilot Chat</text>
  <text x="24" y="157" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#a1a1aa">(Basic)</text>
  <rect x="236" y="126" width="80" height="34" rx="8" fill="#e8b07a"/>
  <rect x="324" y="126" width="80" height="34" rx="8" fill="#27272a" stroke="#3f3f46"/>
  <rect x="412" y="126" width="80" height="34" rx="8" fill="#27272a" stroke="#3f3f46"/>
  <text x="24" y="206" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#fafafa" font-weight="600">Microsoft 365 Copilot</text>
  <text x="24" y="225" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#a1a1aa">(Basic)</text>
  <rect x="236" y="194" width="80" height="34" rx="8" fill="#e8b07a"/>
