  <text x="24" y="274" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#fafafa" font-weight="600">Microsoft 365 Copilot</text>
  <text x="24" y="293" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#a1a1aa">(Premium), paid add-on</text>
  <rect x="236" y="262" width="80" height="34" rx="8" fill="#e8b07a"/>
