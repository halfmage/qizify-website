<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 444" role="img" aria-label="Line chart: closed-API cost scales per token with usage while self-hosted cost stays flat once running. The illustrative crossover sits at roughly 10 to 50 million tokens per month; below it the API is cheaper, above it self-hosting is.">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a89e92"/></marker></defs>
  <rect x="0" y="0" width="520" height="444" rx="16" fill="#2a2622"/>
  <text x="24" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#faf8f4" font-weight="600">When self-hosting starts to pay off</text>
  <text x="24" y="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a89e92">Break-even at roughly 10 to 50M tokens per month</text>
  <text x="24" y="86" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">Monthly cost</text>
  <path d="M56,96 L56,266 L496,266" stroke="#46402f" stroke-width="1.5" fill="none"/>
  <path d="M56,246 L496,110" stroke="#cc7a3e" stroke-width="2.5" fill="none"/>
  <path d="M56,166 L496,154" stroke="#786d60" stroke-width="2.5" fill="none"/>
  <path d="M351,158 L351,266" stroke="#a89e92" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="351" cy="158" r="5.5" fill="#e8b07a"/>
  <text x="343" y="144" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#e8b07a" font-weight="600" text-anchor="end">break-even</text>
  <text x="64" y="258" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">API cheaper</text>
  <text x="492" y="258" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92" text-anchor="end">self-hosting cheaper</text>
  <text x="496" y="286" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92" text-anchor="end">Monthly usage (tokens)</text>
  <rect x="24" y="306" width="12" height="12" rx="2" fill="#cc7a3e"/>
  <text x="44" y="317" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">Closed API</text>
  <rect x="124.0" y="306" width="12" height="12" rx="2" fill="#786d60"/>
  <text x="144.0" y="317" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">Self-hosted</text>
  <text x="24" y="358" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">Closed API: cost scales per token. Self-hosted: flat once</text>
  <text x="24" y="376" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">running.</text>
  <text x="24" y="402" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">Illustrative. The crossover depends on your model, your</text>
  <text x="24" y="420" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">hardware, and how fully the GPUs are used.</text>
</svg>
