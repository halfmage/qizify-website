<svg xmlns="http://www.w3.org/2000/svg" width="340" height="404" viewBox="0 0 340 404" role="img" aria-label="Gestapelte Balken: Zeitpunkt vorzeitiger Vertragslösungen 2024. Industrie und Handel: 36,5 Prozent in der Probezeit, 33,9 Prozent später im ersten Jahr, 22,3 im zweiten Jahr, 7,3 später. Alle Berufe: 34,7, 32,9, 23,1 und 9,3 Prozent. Quelle: BIBB-Datenreport 2026, Tabelle A5.6-1.">
<rect x="0" y="0" width="340" height="404" rx="14" fill="#18181b"/>
<text x="18" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="19" fill="#fafafa" font-weight="600">Zwei Drittel gehen im ersten</text>
