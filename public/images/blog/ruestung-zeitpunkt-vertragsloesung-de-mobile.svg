<text x="18" y="82" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" fill="#a1a1aa">Wann vorzeitig gelöste Verträge 2024 endeten</text>
<text x="18" y="116" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13.5" fill="#d4d4d8">Industrie und Handel</text>
