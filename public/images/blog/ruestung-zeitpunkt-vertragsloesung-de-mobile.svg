<text x="173.5" y="203" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#18181b" font-weight="600" text-anchor="middle">32,9 %</text>
<rect x="223.5" y="184" width="68.2" height="28" rx="4" fill="#71717a"/>
<text x="258.6" y="203" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#fafafa" font-weight="600" text-anchor="middle">23,1 %</text>
<rect x="293.7" y="184" width="26.3" height="28" rx="4" fill="#52525b"/>
<rect x="18" y="236" width="12" height="12" rx="2" fill="#cc7a3e"/>
<text x="36" y="247" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#d4d4d8">Probezeit (bis 4 Monate)</text>
