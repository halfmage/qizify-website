<text x="180.5" y="143" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#18181b" font-weight="600" text-anchor="middle">33,9 %</text>
<rect x="232.0" y="124" width="65.8" height="28" rx="4" fill="#71717a"/>
<text x="265.9" y="143" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#fafafa" font-weight="600" text-anchor="middle">22,3 %</text>
<rect x="299.8" y="124" width="20.2" height="28" rx="4" fill="#52525b"/>
