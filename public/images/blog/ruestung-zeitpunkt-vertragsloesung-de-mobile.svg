<text x="36" y="313" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#d4d4d8">später (7,3 % bzw. 9,3 %)</text>
<text x="18" y="372" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#71717a">Quelle: BIBB-Datenreport 2026, Tabelle A5.6-1.</text>
<text x="18" y="390" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#71717a">Anteil an allen Vertragslösungen 2024, bundesweit.</text>
