<svg xmlns="http://www.w3.org/2000/svg" width="520" height="262" viewBox="0 0 520 262" role="img" aria-label="Zeitleiste: 2005 entwickelt die Schuldnerhilfe Essen ihren FinanzFührerschein. 2006 erste Kurse in Oberösterreich. Februar 2020 Start in Wien. Schuljahr 2022/23: 3.500 Abschlüsse in Oberösterreich. Juni 2025: der 50.000ste Finanzführerschein in Oberösterreich. Quellen: Schuldnerhilfe Essen, Schuldnerhilfe OÖ, FSW Wien, Land Oberösterreich.">
<rect x="0" y="0" width="520" height="262" rx="16" fill="#18181b"/>
<text x="24" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="21" fill="#fafafa" font-weight="600">Zwanzig Jahre Finanzführerschein</text>
<text x="24" y="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" fill="#a1a1aa">Ausgewählte Stationen, OÖ = Oberösterreich</text>
<line x1="72" y1="116" x2="448" y2="116" stroke="#52525b" stroke-width="2"/>
<circle cx="72.0" cy="116" r="7" fill="#fafafa" stroke="#18181b" stroke-width="2"/>
<text x="72.0" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#fafafa" font-weight="600" text-anchor="middle">2005</text>
<text x="72.0" y="146" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" fill="#d4d4d8" text-anchor="middle">Schuldnerhilfe Essen</text>
<text x="72.0" y="163" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" fill="#d4d4d8" text-anchor="middle">entwickelt den</text>
<text x="72.0" y="180" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" fill="#d4d4d8" text-anchor="middle">FinanzFührerschein</text>
<circle cx="166.0" cy="116" r="7" fill="#fafafa" stroke="#18181b" stroke-width="2"/>
<text x="166.0" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#fafafa" font-weight="600" text-anchor="middle">2006</text>
<text x="166.0" y="146" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" fill="#d4d4d8" text-anchor="middle">Erste Kurse</text>
<text x="166.0" y="163" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" fill="#d4d4d8" text-anchor="middle">in OÖ</text>
<circle cx="260.0" cy="116" r="7" fill="#fafafa" stroke="#18181b" stroke-width="2"/>
<text x="260.0" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#fafafa" font-weight="600" text-anchor="middle">2020</text>
<text x="260.0" y="146" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" fill="#d4d4d8" text-anchor="middle">Wien startet</text>
<text x="260.0" y="163" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" fill="#d4d4d8" text-anchor="middle">im Februar</text>
<circle cx="354.0" cy="116" r="7" fill="#fafafa" stroke="#18181b" stroke-width="2"/>
<text x="354.0" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#fafafa" font-weight="600" text-anchor="middle">2022/23</text>
<text x="354.0" y="146" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" fill="#d4d4d8" text-anchor="middle">3.500</text>
<text x="354.0" y="163" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" fill="#d4d4d8" text-anchor="middle">Abschlüsse in OÖ</text>
<circle cx="448.0" cy="116" r="7" fill="#e8b07a" stroke="#18181b" stroke-width="2"/>
<text x="448.0" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#e8b07a" font-weight="600" text-anchor="middle">2025</text>
<text x="448.0" y="146" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" fill="#d4d4d8" text-anchor="middle">Der 50.000ste</text>
<text x="448.0" y="163" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" fill="#d4d4d8" text-anchor="middle">in OÖ (Juni)</text>
<text x="24" y="226" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#71717a">Quellen: Schuldnerhilfe Essen, Schuldnerhilfe OÖ, FSW Wien, Land OÖ;</text>
<text x="24" y="242" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#71717a">Stand Oktober 2026</text>
</svg>
