<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 528" role="img" aria-label="Hardware ladder for open models: 20 to 30 billion parameters quantized run on one mid-range 24 GB GPU for low hundreds of euros a month; 120 billion on a single 80 to 96 GB GPU from around 900 euros; 200 billion and above on a multi-GPU node in the four figures.">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a89e92"/></marker></defs>
  <rect x="0" y="0" width="520" height="528" rx="16" fill="#2a2622"/>
  <text x="24" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#faf8f4" font-weight="600">What it runs on</text>
  <text x="24" y="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a89e92">Open models got efficient: bigger models, still modest</text>
  <text x="24" y="78" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a89e92">hardware</text>
  <rect x="24" y="100" width="472" height="108" rx="10" fill="#37322c" stroke="#cc7a3e" stroke-width="2"/>
  <text x="44" y="126" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#e8b07a" font-weight="600" letter-spacing="0.05em">20-30B, QUANTIZED</text>
  <text x="44" y="172" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">One mid-range GPU: a single 24 GB card</text>
  <text x="44" y="198" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Low hundreds of euros per month</text>
  <rect x="24" y="220" width="472" height="108" rx="10" fill="#37322c" stroke="#46402f" stroke-width="1"/>
  <text x="44" y="246" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92" font-weight="600" letter-spacing="0.05em">120B, FOR EXAMPLE GPT-OSS</text>
  <text x="44" y="292" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">One 80 to 96 GB GPU: a single server</text>
  <text x="44" y="318" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">From around 900 euros per month</text>
  <rect x="24" y="340" width="472" height="108" rx="10" fill="#37322c" stroke="#46402f" stroke-width="1"/>
  <text x="44" y="366" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92" font-weight="600" letter-spacing="0.05em">200B AND ABOVE, LARGEST OPEN MODELS</text>
  <text x="44" y="412" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Multi-GPU node: eight or more GPUs</text>
  <text x="44" y="438" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Four figures per month</text>
  <text x="24" y="486" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">EU providers: Hetzner, OVHcloud, Scaleway, IONOS. Prices</text>
  <text x="24" y="504" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">indicative, as of 2026.</text>
</svg>
