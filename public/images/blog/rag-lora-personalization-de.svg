<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 474" role="img" aria-label="Diagramm: zwei Schichten machen aus einem offenen Basismodell Ihre eigene KI. Retrieval (RAG) antwortet aus Ihren eigenen Inhalten und ändert, was das Modell weiß. Fine-Tuning (LoRA) übernimmt Ihren Stil, Ihre Formate und Aufgaben und ändert, wie sich das Modell verhält. Beide Schichten sitzen auf einem gemeinsamen offenen Basismodell auf.">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a89e92"/></marker></defs>
  <rect x="0" y="0" width="520" height="474" rx="16" fill="#2a2622"/>
  <text x="24" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#faf8f4" font-weight="600">Wie aus einem Modell Ihre KI wird</text>
  <text x="24" y="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a89e92">Zwei Schichten auf einem gemeinsamen Basismodell</text>
  <rect x="170" y="80" width="326" height="168" rx="10" fill="#37322c" stroke="#46402f" stroke-width="1"/>
  <text x="186" y="108" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" fill="#faf8f4" font-weight="600">Retrieval (RAG)</text>
  <text x="186" y="128" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Antwortet aus Ihren eigenen Inhalten</text>
  <text x="186" y="148" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Ändert, was das Modell weiß</text>
  <text x="24" y="107.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">Ihre Inhalte und</text>
  <text x="24" y="124.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">Dokumente</text>
  <path d="M156,122.0 L164,122.0" stroke="#a89e92" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M170,164 L496,164" stroke="#46402f" stroke-width="1"/>
  <text x="186" y="192" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" fill="#faf8f4" font-weight="600">Fine-Tuning (LoRA)</text>
  <text x="186" y="212" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Ihr Stil, Ihre Formate und Aufgaben</text>
  <text x="186" y="232" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Ändert, wie sich das Modell verhält</text>
  <text x="24" y="191.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">Ihr Ton und Ihre</text>
  <text x="24" y="208.5" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">Formate</text>
  <path d="M156,206.0 L164,206.0" stroke="#a89e92" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="160" y="248" width="346" height="52" rx="10" fill="#3a3128" stroke="#cc7a3e" stroke-width="1.5"/>
  <text x="176" y="270" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" fill="#e8b07a" font-weight="600">Ein gemeinsames offenes Basismodell</text>
  <text x="176" y="289" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">Dasselbe Modell für alle Kunden</text>
  <path d="M260,300 L260,316" stroke="#a89e92" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="24" y="326" width="472" height="68" rx="10" fill="#37322c" stroke="#cc7a3e" stroke-width="2"/>
  <text x="40" y="352" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Ergibt Ihre eigene KI: je Kunde ein LoRA-Adapter und ein</text>
  <text x="40" y="372" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">RAG-Index</text>
  <text x="24" y="432" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">Ein gemeinsames Basismodell, je Kunde ein LoRA-Adapter und ein</text>
  <text x="24" y="450" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">RAG-Index: personalisierte KI, Daten getrennt.</text>
</svg>
