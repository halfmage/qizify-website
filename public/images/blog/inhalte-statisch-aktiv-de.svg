<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 573" role="img" aria-label="Vergleich, was ein Standard-LMS und eine eigene Plattform aus demselben Kursmaterial machen: aus Skript und Folien wird ein PDF und ein Video, gegenüber einem Lernpfad entlang des Stoffplans; aus Fragen wird ein einmaliges Quiz, gegenüber Fragen mit Lernziel und Anforderungstiefe; aus Fortschritt wird ein Häkchen, gegenüber Wiederholung dessen, was noch nicht sitzt; und für die Prüfung selbst bietet das Standard-LMS nichts, während die eigene Plattform eine Prüfungssimulation im Originalformat fährt. Die lernende Person liest, oder sie wird gefragt und korrigiert.">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a89e92"/></marker></defs>
  <rect x="0" y="0" width="520" height="573" rx="16" fill="#2a2622"/>
  <text x="24" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#faf8f4" font-weight="600">Dieselben Inhalte, zwei sehr verschiedene</text>
  <text x="24" y="63" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#faf8f4" font-weight="600">Ergebnisse</text>
  <text x="24" y="87" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a89e92">Ihr Material, und was die jeweilige Software daraus macht</text>
  <rect x="258" y="105" width="250" height="394" rx="12" fill="#3a3128"/>
  <text x="24" y="121" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" fill="#a89e92" font-weight="600" letter-spacing="0.06em">Im Standard-LMS</text>
  <text x="270" y="121" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" fill="#e8b07a" font-weight="600" letter-spacing="0.06em">In einer eigenen Plattform</text>
  <path d="M24,131 L496,131" stroke="#46402f" stroke-width="1"/>
  <text x="24" y="151" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#a89e92" font-weight="600" letter-spacing="0.08em">SKRIPT UND FOLIEN</text>
  <text x="24" y="169" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">ein PDF zum Herunterladen,</text>
  <text x="24" y="189" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">ein Video</text>
  <text x="270" y="169" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4">ein Lernpfad entlang des</text>
  <text x="270" y="189" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4">Stoffplans</text>
  <path d="M24,203 L496,203" stroke="#46402f" stroke-width="1"/>
  <text x="24" y="223" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#a89e92" font-weight="600" letter-spacing="0.08em">FRAGEN</text>
  <text x="24" y="241" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">ein einmaliges Quiz</text>
  <text x="270" y="241" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4">Lernziel und</text>
  <text x="270" y="261" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4">Anforderungstiefe bei jeder</text>
  <text x="270" y="281" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4">Frage</text>
  <path d="M24,295 L496,295" stroke="#46402f" stroke-width="1"/>
  <text x="24" y="315" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#a89e92" font-weight="600" letter-spacing="0.08em">FORTSCHRITT</text>
  <text x="24" y="333" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">ein Häkchen</text>
  <text x="270" y="333" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4">Wiederholung genau</text>
  <text x="270" y="353" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4">dessen, was noch nicht</text>
  <text x="270" y="373" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4">sitzt</text>
  <path d="M24,387 L496,387" stroke="#46402f" stroke-width="1"/>
  <text x="24" y="407" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#a89e92" font-weight="600" letter-spacing="0.08em">DIE PRÜFUNG SELBST</text>
  <text x="24" y="425" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#6f6459" font-style="italic">nichts</text>
  <text x="270" y="425" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4">eine Prüfungssimulation im</text>
  <text x="270" y="445" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#faf8f4">Originalformat</text>
  <path d="M24,459 L496,459" stroke="#46402f" stroke-width="1"/>
  <text x="24" y="485" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#a89e92" font-weight="600">Die lernende Person liest.</text>
  <text x="270" y="485" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#e8b07a" font-weight="600">Sie wird gefragt und korrigiert.</text>
  <text x="24" y="531" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">In beiden Fällen bleibt das Material Ihres. Der Unterschied ist, ob es</text>
  <text x="24" y="549" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a89e92">abgelegt oder benutzt wird.</text>
</svg>
