<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 286" role="img" aria-label="Faster but not better. 97 percent of product managers report improved personal productivity from AI, while 64 percent report improved product outcomes such as more revenue or faster time to market. A gap of 33 percentage points. Source: Product Focus 2026 Survey of the Product Management Profession, 677 respondents across 40 countries.">
  <rect x="0" y="0" width="520" height="286" rx="16" fill="#2a2622"/>
  <text x="24" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#faf8f4" font-weight="600">Faster, but not better</text>
  <text x="24" y="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a89e92">Product managers reporting improvement from AI</text>
  <text x="24" y="102" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Personal productivity</text>
  <rect x="24" y="114" width="400" height="28" rx="6" fill="#37322c"/>
  <rect x="24" y="114" width="388" height="28" rx="6" fill="#786d60"/>
  <text x="436" y="134" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="17" fill="#faf8f4" font-weight="600">97%</text>
  <text x="24" y="180" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cfc7be">Product outcomes</text>
  <rect x="24" y="192" width="400" height="28" rx="6" fill="#37322c"/>
  <rect x="24" y="192" width="256" height="28" rx="6" fill="#e8b07a"/>
  <text x="436" y="212" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="17" fill="#faf8f4" font-weight="600">64%</text>
  <path d="M280,226 L280,244" stroke="#cc7a3e" stroke-width="1.5"/>
  <path d="M412,226 L412,244" stroke="#cc7a3e" stroke-width="1.5"/>
  <path d="M280,244 L412,244" stroke="#cc7a3e" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="24" y="274" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#cc7a3e" font-weight="600">33 percentage points between working quicker and shipping better</text>
</svg>
