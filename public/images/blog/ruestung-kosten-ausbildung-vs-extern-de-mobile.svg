<svg xmlns="http://www.w3.org/2000/svg" width="340" height="360" viewBox="0 0 340 360" role="img" aria-label="Balkendiagramm: Ein Azubi kostet im Schnitt rund 26.200 Euro brutto pro Jahr, netto nach den Erträgen seiner Mitarbeit rund 8.100 Euro. Eine Fachkraft extern zu gewinnen kostet rund 13.700 Euro. Quelle: BIBB-Kosten-Nutzen-Erhebung 2022/23.">
<rect x="0" y="0" width="340" height="360" rx="14" fill="#18181b"/>
<text x="18" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="19" fill="#fafafa" font-weight="600">Was Ausbildung kostet, und was</text>
<text x="18" y="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="19" fill="#fafafa" font-weight="600">die Alternative kostet</text>
<text x="18" y="82" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" fill="#a1a1aa">Durchschnitt pro Person, alle Berufe,</text>
<text x="18" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" fill="#a1a1aa">2022/23</text>
<text x="18" y="134" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13.5" fill="#d4d4d8">Ausbildung, brutto pro Jahr</text>
<rect x="18" y="142" width="234.0" height="22" rx="4" fill="#71717a"/>
<text x="260.0" y="158" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#fafafa" font-weight="600">26.200 €</text>
<text x="18" y="186" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13.5" fill="#d4d4d8">Ausbildung, netto pro Jahr (nach</text>
<text x="18" y="204" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13.5" fill="#d4d4d8">Mitarbeit)</text>
<rect x="18" y="212" width="72.3" height="22" rx="4" fill="#e8b07a"/>
<text x="98.3" y="228" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#fafafa" font-weight="600">8.100 €</text>
<text x="18" y="256" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13.5" fill="#d4d4d8">Fachkraft extern gewinnen, einmalig</text>
<rect x="18" y="264" width="122.4" height="22" rx="4" fill="#cc7a3e"/>
<text x="148.4" y="280" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#fafafa" font-weight="600">13.700 €</text>
<text x="18" y="328" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#71717a">Quelle: BIBB-Kosten-Nutzen-Erhebung 2022/23</text>
<text x="18" y="346" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#71717a">(Pressemitteilung 31.07.2025)</text>
</svg>