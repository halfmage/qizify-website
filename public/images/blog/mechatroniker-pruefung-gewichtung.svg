<svg xmlns="http://www.w3.org/2000/svg" width="520" height="561" viewBox="0 0 520 561" role="img" aria-label="Bar chart: Part 1 of the German mechatronics final exam, work on a mechatronic subsystem, counts for 40 percent. Part 2: work assignment 30 percent, work planning 12, functional analysis 12, economic and social studies 6 percent. Source: MechatronikerAusbV.">
<rect x="0" y="0" width="520" height="561" rx="16" fill="#18181b"/>
<text x="24" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#fafafa" font-weight="600">Part 1 counts for 40% of</text>
<text x="24" y="63" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#fafafa" font-weight="600">the final grade</text>
<text x="24" y="89" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a1a1aa">German mechatronics final exam in two parts,</text>
<text x="24" y="109" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a1a1aa">weight of each exam area</text>
<text x="24" y="149" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15.5" fill="#fafafa" font-weight="600">Part 1, before the end of year two</text>
<text x="24" y="175" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#e8b07a" font-weight="600">Work on a mechatronic subsystem</text>
<rect x="24" y="183" width="380.0" height="24" rx="4" fill="#cc7a3e"/>
<text x="412.0" y="200" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#e8b07a" font-weight="600">40%</text>
<text x="24" y="247" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15.5" fill="#fafafa" font-weight="600">Part 2</text>
<text x="24" y="273" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#d4d4d8">Work assignment</text>
<rect x="24" y="281" width="285.0" height="24" rx="4" fill="#71717a"/>
<text x="317.0" y="298" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#fafafa" font-weight="600">30%</text>
<text x="24" y="331" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#d4d4d8">Work planning</text>
<rect x="24" y="339" width="114.0" height="24" rx="4" fill="#71717a"/>
<text x="146.0" y="356" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#fafafa" font-weight="600">12%</text>
<text x="24" y="389" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#d4d4d8">Functional analysis</text>
<rect x="24" y="397" width="114.0" height="24" rx="4" fill="#71717a"/>
<text x="146.0" y="414" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#fafafa" font-weight="600">12%</text>
<text x="24" y="447" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#d4d4d8">Economic and social studies</text>
<rect x="24" y="455" width="57.0" height="24" rx="4" fill="#71717a"/>
<text x="89.0" y="472" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#fafafa" font-weight="600">6%</text>
<text x="24" y="519" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a1a1aa">Source: German mechatronics training regulation</text>
<text x="24" y="537" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#a1a1aa">(MechatronikerAusbV), §§ 6 and 8</text>
