<svg xmlns="http://www.w3.org/2000/svg" width="520" height="336" viewBox="0 0 520 336" role="img" aria-label="How a single signal becomes a false pattern: thirty support tickets are pasted in, one of them mentions single sign-on once in passing, and the summary that comes back says customers consistently request single sign-on. One ticket in thirty, reported as consistent.">
  <rect x="0" y="0" width="520" height="336" rx="16" fill="#18181b"/>
  <text x="24" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="23" fill="#fafafa" font-weight="600">One mention is not a pattern</text>
  <text x="24" y="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="15" fill="#a1a1aa">The failure mode to expect when you ask for themes</text>
  <text x="24" y="92" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#a1a1aa" font-weight="600" letter-spacing="0.08em">30 SUPPORT TICKETS PASTED IN</text>
  <g fill="#71717a">
    <rect x="24" y="104" width="14" height="14" rx="3"/><rect x="44" y="104" width="14" height="14" rx="3"/><rect x="64" y="104" width="14" height="14" rx="3"/><rect x="84" y="104" width="14" height="14" rx="3"/><rect x="104" y="104" width="14" height="14" rx="3"/><rect x="124" y="104" width="14" height="14" rx="3"/><rect x="144" y="104" width="14" height="14" rx="3"/><rect x="164" y="104" width="14" height="14" rx="3"/><rect x="184" y="104" width="14" height="14" rx="3"/><rect x="204" y="104" width="14" height="14" rx="3"/>
    <rect x="24" y="124" width="14" height="14" rx="3"/><rect x="44" y="124" width="14" height="14" rx="3"/><rect x="64" y="124" width="14" height="14" rx="3"/><rect x="104" y="124" width="14" height="14" rx="3"/><rect x="124" y="124" width="14" height="14" rx="3"/><rect x="144" y="124" width="14" height="14" rx="3"/><rect x="164" y="124" width="14" height="14" rx="3"/><rect x="184" y="124" width="14" height="14" rx="3"/><rect x="204" y="124" width="14" height="14" rx="3"/>
    <rect x="24" y="144" width="14" height="14" rx="3"/><rect x="44" y="144" width="14" height="14" rx="3"/><rect x="64" y="144" width="14" height="14" rx="3"/><rect x="84" y="144" width="14" height="14" rx="3"/><rect x="104" y="144" width="14" height="14" rx="3"/><rect x="124" y="144" width="14" height="14" rx="3"/><rect x="144" y="144" width="14" height="14" rx="3"/><rect x="164" y="144" width="14" height="14" rx="3"/><rect x="184" y="144" width="14" height="14" rx="3"/><rect x="204" y="144" width="14" height="14" rx="3"/>
  </g>
  <rect x="84" y="124" width="14" height="14" rx="3" fill="#e8b07a"/>
  <text x="240" y="118" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#e8b07a" font-weight="600">1 ticket</text>
  <text x="240" y="138" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#d4d4d8">mentioned single sign-on,</text>
  <text x="240" y="158" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#d4d4d8">once, as an aside</text>
  <path d="M24,196 L496,196" stroke="#3f3f46" stroke-width="1"/>
  <text x="24" y="222" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#a1a1aa" font-weight="600" letter-spacing="0.08em">WHAT CAME BACK</text>
  <rect x="24" y="234" width="472" height="52" rx="12" fill="#27272a"/>
  <text x="42" y="266" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" fill="#fafafa">"Customers consistently request single sign-on."</text>
  <text x="24" y="314" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#e8b07a" font-weight="600">One ticket in thirty, reported as consistent.</text>
</svg>
