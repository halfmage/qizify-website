<text x="148.7" y="162" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#fafafa" font-weight="600" text-anchor="middle">W2</text>
<circle cx="175.1" cy="176" r="7" fill="#fafafa" stroke="#18181b" stroke-width="2"/>
<text x="175.1" y="162" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#fafafa" font-weight="600" text-anchor="middle">W6</text>
<circle cx="216.1" cy="176" r="7" fill="#fafafa" stroke="#18181b" stroke-width="2"/>
<text x="216.1" y="162" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#fafafa" font-weight="600" text-anchor="middle">W12</text>
