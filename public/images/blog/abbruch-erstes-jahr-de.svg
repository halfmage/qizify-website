<text x="392.1" y="162" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#fafafa" font-weight="600" text-anchor="middle">alle 3 Monate</text>
<text x="24" y="238" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#d4d4d8">W = Woche. Die Probezeit dauert je nach Vertrag 1 bis 4 Monate.</text>
<text x="24" y="264" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" fill="#71717a">Quelle: BIBB-Datenreport 2026, Tabelle A5.6-1; Probezeit nach § 20 BBiG</text>
</svg>