<line x1="251.33333333333331" y1="172" x2="251.33333333333331" y2="180" stroke="#52525b" stroke-width="2"/>
<text x="251.33333333333331" y="198" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" fill="#a1a1aa" text-anchor="middle">Monat 4</text>
<line x1="368.66666666666663" y1="172" x2="368.66666666666663" y2="180" stroke="#52525b" stroke-width="2"/>
<text x="368.66666666666663" y="198" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" fill="#a1a1aa" text-anchor="middle">Monat 8</text>
<line x1="486.0" y1="172" x2="486.0" y2="180" stroke="#52525b" stroke-width="2"/>
<text x="486.0" y="198" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" fill="#a1a1aa" text-anchor="middle">Monat 12</text>
